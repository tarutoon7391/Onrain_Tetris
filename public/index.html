<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>オンラインテトリス</title>
  <style>
    :root {
      --bg: #111827;
      --panel: #1f2937;
      --text: #e5e7eb;
      --accent: #60a5fa;
      --border: #374151;
      --danger: #ef4444;
      --ok: #22c55e;
      --warn: #f59e0b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background: radial-gradient(circle at top, #1f2937 0%, #0b1020 65%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .app {
      width: min(1040px, 100%);
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 18px;
      background: rgba(17, 24, 39, 0.78);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      backdrop-filter: blur(2px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
    }

    .left {
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .right {
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .panel {
      background: linear-gradient(180deg, rgba(31, 41, 55, 0.95), rgba(17, 24, 39, 0.95));
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }

    h1 {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: 0.04em;
      color: #fff;
    }

    .stats {
      display: grid;
      gap: 8px;
      font-size: 0.95rem;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed rgba(148, 163, 184, 0.25);
      padding-bottom: 6px;
    }

    .stat:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .value {
      color: var(--accent);
      font-weight: 700;
      min-width: 5.2em;
      text-align: right;
    }

    #game {
      display: block;
      width: 300px;
      height: 600px;
      border: 2px solid #64748b;
      border-radius: 8px;
      background: #030712;
    }

    #next1,
    #next2,
    #hold {
      display: block;
      width: 120px;
      height: 120px;
      border: 2px solid #64748b;
      border-radius: 8px;
      background: #030712;
      margin-top: 8px;
    }

    .status {
      min-height: 1.5em;
      font-size: 0.95rem;
      color: #bfdbfe;
    }

    .status.over {
      color: var(--danger);
      font-weight: 700;
    }

    .status.playing {
      color: var(--ok);
      font-weight: 700;
    }

    .match-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
      font-size: 0.93rem;
    }

    .match-line strong {
      color: #f8fafc;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      background: rgba(96, 165, 250, 0.16);
      color: #bfdbfe;
    }

    .badge.waiting {
      background: rgba(245, 158, 11, 0.18);
      color: #fde68a;
    }

    .badge.playing {
      background: rgba(34, 197, 94, 0.18);
      color: #86efac;
    }

    .controls {
      line-height: 1.75;
      font-size: 0.9rem;
      color: #cbd5e1;
    }

    .controls span {
      color: #f8fafc;
      font-weight: 600;
    }

    button {
      cursor: pointer;
      border: 1px solid #3b82f6;
      color: white;
      background: linear-gradient(180deg, #3b82f6, #2563eb);
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 10px 12px;
    }

    button:hover {
      filter: brightness(1.08);
    }

    button:active {
      transform: translateY(1px);
    }

    @media (max-width: 820px) {
      .app {
        grid-template-columns: 1fr;
      }

      .left {
        justify-items: center;
      }

      .panel {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="left">
      <canvas id="game" width="300" height="600" aria-label="テトリス盤面"></canvas>
      <div class="status" id="status">サーバーへ接続中...</div>
      <button id="restartBtn" type="button">リスタート</button>
      <button id="levelUpBtn" type="button">デバッグ: レベル+1</button>
    </div>

    <div class="right">
      <div class="panel">
        <h1>オンラインテトリス</h1>
      </div>

      <div class="panel">
        <div class="match-line"><strong>対戦状態</strong><span id="matchBadge" class="badge waiting">待機中</span></div>
        <div class="match-line"><span>ルームID</span><span id="roomId">-</span></div>
        <div class="match-line"><span>プレイヤー番号</span><span id="playerNumber">-</span></div>
        <div class="match-line"><span>受信おじゃま</span><span id="garbageStock">0</span></div>
      </div>

      <div class="panel stats">
        <div class="stat"><span>スコア</span><span class="value" id="score">0</span></div>
        <div class="stat"><span>消去ライン</span><span class="value" id="lines">0</span></div>
        <div class="stat"><span>レベル</span><span class="value" id="level">1</span></div>
      </div>

      <div class="panel">
        <div>ネクスト（2つ）</div>
        <canvas id="next1" width="120" height="120" aria-label="次のピース1"></canvas>
        <canvas id="next2" width="120" height="120" aria-label="次のピース2"></canvas>
      </div>

      <div class="panel">
        <div>ホールド</div>
        <canvas id="hold" width="120" height="120" aria-label="ホールドピース"></canvas>
      </div>

      <div class="panel controls">
        <div><span>← →</span> : 左右移動</div>
        <div><span>↑ / X</span> : 時計回り回転</div>
        <div><span>Z</span> : 反時計回り回転</div>
        <div><span>↓</span> : ソフトドロップ</div>
        <div><span>スペース</span> : ハードドロップ</div>
        <div><span>Shift / C</span> : ホールド</div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // Socket.ioへ接続する
    const socket = io();

    // 盤面サイズと描画サイズの定義
    const COLS = 10;
    const ROWS = 20;
    const BLOCK = 30;

    // 落下速度制御の定義
    const BASE_DROP_MS = 800;
    const MIN_DROP_MS = 80;
    const LEVEL_LINES = 10;
    const LEVEL_SPEED_RATIO = 0.86;
    const LOCK_DELAY_MS = 450;

    // スコア倍率の定義
    const SCORE_MULTIPLIER = {
      1: 1,
      2: 3,
      3: 5,
      4: 8,
    };

    // T-Spin成立時のスコア定義
    const T_SPIN_SCORE = {
      0: 400,
      1: 800,
      2: 1200,
      3: 1600,
    };

    // 各テトリミノの形状データ
    const SHAPES = {
      I: [[1, 1, 1, 1]],
      O: [
        [1, 1],
        [1, 1],
      ],
      T: [
        [0, 1, 0],
        [1, 1, 1],
        [0, 0, 0],
      ],
      S: [
        [0, 1, 1],
        [1, 1, 0],
      ],
      Z: [
        [1, 1, 0],
        [0, 1, 1],
      ],
      J: [
        [1, 0, 0],
        [1, 1, 1],
      ],
      L: [
        [0, 0, 1],
        [1, 1, 1],
      ],
    };

    // 各テトリミノの色定義
    const COLORS = {
      I: "#22d3ee",
      O: "#facc15",
      S: "#4ade80",
      Z: "#f87171",
      J: "#60a5fa",
      L: "#fb923c",
      T: "#a78bfa",
      G: "#6b7280",
    };

    // 生成対象の定義
    const PIECES = ["I", "O", "T", "S", "Z", "J", "L"];

    // SRSキックテーブル（J/L/S/T/Z用）
    const KICK_JLSTZ = {
      "0>1": [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],
      "1>0": [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
      "1>2": [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
      "2>1": [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],
      "2>3": [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]],
      "3>2": [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
      "3>0": [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
      "0>3": [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]],
    };

    // SRSキックテーブル（I用）
    const KICK_I = {
      "0>1": [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]],
      "1>0": [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]],
      "1>2": [[0, 0], [-1, 0], [2, 0], [-1, 2], [2, -1]],
      "2>1": [[0, 0], [1, 0], [-2, 0], [1, -2], [-2, 1]],
      "2>3": [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]],
      "3>2": [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]],
      "3>0": [[0, 0], [1, 0], [-2, 0], [1, -2], [-2, 1]],
      "0>3": [[0, 0], [-1, 0], [2, 0], [-1, 2], [2, -1]],
    };

    // CanvasとUI要素の参照
    const gameCanvas = document.getElementById("game");
    const next1Canvas = document.getElementById("next1");
    const next2Canvas = document.getElementById("next2");
    const holdCanvas = document.getElementById("hold");
    const g = gameCanvas.getContext("2d");
    const n1 = next1Canvas.getContext("2d");
    const n2 = next2Canvas.getContext("2d");
    const h = holdCanvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const linesEl = document.getElementById("lines");
    const levelEl = document.getElementById("level");
    const statusEl = document.getElementById("status");
    const restartBtn = document.getElementById("restartBtn");
    const levelUpBtn = document.getElementById("levelUpBtn");
    const matchBadgeEl = document.getElementById("matchBadge");
    const roomIdEl = document.getElementById("roomId");
    const playerNumberEl = document.getElementById("playerNumber");
    const garbageStockEl = document.getElementById("garbageStock");

    // ゲーム状態を保持する変数
    let board = [];
    let current = null;
    let score = 0;
    let clearedLines = 0;
    let level = 1;
    let gameOver = false;
    let lastTime = 0;
    let dropAccumulator = 0;
    let animationId = null;
    let bag = [];
    let nextQueue = [];
    let holdType = null;
    let canHold = true;
    let lockAccumulator = 0;
    let roomId = "";
    let playerNumber = 0;
    let matchReady = false;
    let pendingGarbage = 0;

    // 盤面を空で初期化する関数
    function createBoard() {
      return Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    }

    // 配列を複製する関数
    function cloneMatrix(matrix) {
      return matrix.map((row) => row.slice());
    }

    // Fisher-Yatesでシャッフルする関数
    function shuffle(array) {
      const result = array.slice();
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = result[i];
        result[i] = result[j];
        result[j] = tmp;
      }
      return result;
    }

    // 7バッグを補充する関数
    function refillBag() {
      bag = shuffle(PIECES);
    }

    // NEXTキューを必要数まで補充する関数
    function ensureNextQueue(minCount = 5) {
      while (nextQueue.length < minCount) {
        if (bag.length === 0) {
          refillBag();
        }
        nextQueue.push(bag.shift());
      }
    }

    // 新しいピースを生成する関数
    function createPiece(type) {
      const shape = cloneMatrix(SHAPES[type]);
      const x = Math.floor((COLS - shape[0].length) / 2);
      const y = 0;
      return { type, shape, x, y, rotation: 0, lastRotate: false };
    }

    // 行列を時計回りに回転する関数
    function rotateClockwise(matrix) {
      const rows = matrix.length;
      const cols = matrix[0].length;
      const rotated = Array.from({ length: cols }, () => Array(rows).fill(0));
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          rotated[x][rows - 1 - y] = matrix[y][x];
        }
      }
      return rotated;
    }

    // 行列を反時計回りに回転する関数
    function rotateCounterClockwise(matrix) {
      const rows = matrix.length;
      const cols = matrix[0].length;
      const rotated = Array.from({ length: cols }, () => Array(rows).fill(0));
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          rotated[cols - 1 - x][y] = matrix[y][x];
        }
      }
      return rotated;
    }

    // 位置衝突を判定する関数
    function collides(matrix, offsetX, offsetY) {
      for (let y = 0; y < matrix.length; y++) {
        for (let x = 0; x < matrix[y].length; x++) {
          if (!matrix[y][x]) {
            continue;
          }
          const bx = offsetX + x;
          const by = offsetY + y;

          if (bx < 0 || bx >= COLS || by >= ROWS) {
            return true;
          }
          if (by >= 0 && board[by][bx]) {
            return true;
          }
        }
      }
      return false;
    }

    // ピースを盤面へ固定する関数
    function mergePiece() {
      const { shape, x: offsetX, y: offsetY, type } = current;
      for (let y = 0; y < shape.length; y++) {
        for (let x = 0; x < shape[y].length; x++) {
          if (!shape[y][x]) {
            continue;
          }
          const by = offsetY + y;
          const bx = offsetX + x;
          if (by >= 0) {
            board[by][bx] = type;
          }
        }
      }
    }

    // 揃ったラインを消去し、消去数を返す関数
    function clearLines() {
      let removed = 0;

      for (let y = ROWS - 1; y >= 0; y--) {
        const filled = board[y].every((cell) => cell !== 0);
        if (!filled) {
          continue;
        }

        board.splice(y, 1);
        board.unshift(Array(COLS).fill(0));
        removed++;
        y++;
      }

      return removed;
    }

    // T-Spin成立判定（簡易版）
    function isTSpin(piece) {
      if (!piece || piece.type !== "T" || !piece.lastRotate) {
        return false;
      }

      const pivotX = piece.x + 1;
      const pivotY = piece.y + 1;
      const corners = [
        [pivotX - 1, pivotY - 1],
        [pivotX + 1, pivotY - 1],
        [pivotX - 1, pivotY + 1],
        [pivotX + 1, pivotY + 1],
      ];

      let blocked = 0;
      for (const [cx, cy] of corners) {
        if (cx < 0 || cx >= COLS || cy < 0 || cy >= ROWS) {
          blocked++;
          continue;
        }
        if (board[cy][cx] !== 0) {
          blocked++;
        }
      }

      return blocked >= 3;
    }

    // 2ライン以上消したときのおじゃま量を計算する関数
    function calculateGarbageLines(removed, tSpin) {
      if (tSpin) {
        if (removed === 1) {
          return 2;
        }
        if (removed === 2) {
          return 4;
        }
        if (removed >= 3) {
          return 6;
        }
        return 0;
      }

      if (removed === 2) {
        return 1;
      }
      if (removed === 3) {
        return 2;
      }
      if (removed >= 4) {
        return 4;
      }
      return 0;
    }

    // スコアとレベルを更新する関数
    function applyScore(removed, tSpin = false) {
      if (tSpin) {
        const tSpinBase = T_SPIN_SCORE[removed] ?? T_SPIN_SCORE[0];
        score += tSpinBase * level;
      } else if (removed > 0) {
        const mul = SCORE_MULTIPLIER[removed] ?? 0;
        score += removed * 100 * mul * level;
      }

      clearedLines += removed;
      level = Math.floor(clearedLines / LEVEL_LINES) + 1;
      updateStats();

      if (tSpin) {
        const labels = ["T-Spin", "T-Spin Single", "T-Spin Double", "T-Spin Triple"];
        setStatus(labels[removed] ?? "T-Spin", false);
      } else if (removed > 0) {
        setStatus(`${removed}ライン消去`, false);
      }
    }

    // 現在レベルに応じた落下間隔を返す関数
    function currentDropInterval() {
      const speed = Math.floor(BASE_DROP_MS * Math.pow(LEVEL_SPEED_RATIO, level - 1));
      return Math.max(MIN_DROP_MS, speed);
    }

    // 接地しているかを判定する関数
    function isGrounded(piece) {
      return piece ? collides(piece.shape, piece.x, piece.y + 1) : false;
    }

    // 受け取ったおじゃまラインを盤面へ反映する関数
    function applyPendingGarbage() {
      if (pendingGarbage <= 0 || gameOver) {
        return;
      }

      const amount = pendingGarbage;
      pendingGarbage = 0;
      updateGarbageStock();

      for (let i = 0; i < amount; i++) {
        board.shift();
        const row = Array(COLS).fill("G");
        row[Math.floor(Math.random() * COLS)] = 0;
        board.push(row);
      }

      if (board[0].some((cell) => cell !== 0)) {
        gameOver = true;
        setStatus("おじゃまでゲームオーバー", true);
      }
    }

    // 現在ピースを固定して次へ進める関数
    function lockCurrentPiece() {
      const tSpin = isTSpin(current);
      mergePiece();
      const removed = clearLines();
      applyScore(removed, tSpin);

      const sendCount = calculateGarbageLines(removed, tSpin);
      if (sendCount > 0 && roomId) {
        socket.emit("garbageLines", {
          roomId,
          count: sendCount,
        });
      }

      canHold = true;
      lockAccumulator = 0;
      applyPendingGarbage();

      if (!gameOver) {
        spawnPiece();
      }
    }

    // 1マス描画関数
    function drawCell(ctx, x, y, color, size, alpha = 1) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      ctx.fillRect(x * size, y * size, size, size);
      ctx.strokeStyle = "rgba(15, 23, 42, 0.7)";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(x * size + 0.5, y * size + 0.5, size - 1, size - 1);
      ctx.fillStyle = "rgba(255,255,255,0.14)";
      ctx.fillRect(x * size + 2, y * size + 2, size - 6, Math.max(3, Math.floor(size * 0.16)));
      ctx.restore();
    }

    // プレビューキャンバスを初期化する関数
    function clearPreview(ctx, canvas) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // 指定Canvasへ1つのピースを描画する関数
    function drawPiecePreview(ctx, canvas, type) {
      clearPreview(ctx, canvas);
      if (!type) {
        return;
      }

      const shape = SHAPES[type];
      const size = 24;
      const shapeW = shape[0].length * size;
      const shapeH = shape.length * size;
      const startX = Math.floor((canvas.width - shapeW) / 2 / size);
      const startY = Math.floor((canvas.height - shapeH) / 2 / size);

      for (let y = 0; y < shape.length; y++) {
        for (let x = 0; x < shape[y].length; x++) {
          if (shape[y][x]) {
            drawCell(ctx, startX + x, startY + y, COLORS[type], size);
          }
        }
      }
    }

    // NEXT表示を更新する関数
    function drawNext() {
      drawPiecePreview(n1, next1Canvas, nextQueue[0] || null);
      drawPiecePreview(n2, next2Canvas, nextQueue[1] || null);
    }

    // HOLD表示を更新する関数
    function drawHold() {
      drawPiecePreview(h, holdCanvas, holdType);
    }

    // ゴーストのY座標を求める関数
    function getGhostY(piece) {
      let ghostY = piece.y;
      while (!collides(piece.shape, piece.x, ghostY + 1)) {
        ghostY++;
      }
      return ghostY;
    }

    // 対戦状態を表示する関数
    function updateMatchInfo(label, playing = false) {
      matchBadgeEl.textContent = label;
      matchBadgeEl.classList.remove("waiting", "playing");
      matchBadgeEl.classList.add(playing ? "playing" : "waiting");
      roomIdEl.textContent = roomId || "-";
      playerNumberEl.textContent = playerNumber ? String(playerNumber) : "-";
    }

    // 受信おじゃま数を表示する関数
    function updateGarbageStock() {
      garbageStockEl.textContent = String(pendingGarbage);
    }

    // 盤面や表示を待機状態へ戻す関数
    function resetForWaiting() {
      board = createBoard();
      current = null;
      nextQueue = [];
      holdType = null;
      pendingGarbage = 0;
      updateGarbageStock();
      drawBoard();
      drawPiecePreview(n1, next1Canvas, null);
      drawPiecePreview(n2, next2Canvas, null);
      drawPiecePreview(h, holdCanvas, null);
    }

    // 次ピース情報を使って新しい現在ピースを出す関数
    function spawnPiece(forcedType = null) {
      ensureNextQueue(5);

      const pieceType = forcedType ?? nextQueue.shift();
      ensureNextQueue(5);

      current = createPiece(pieceType);
      lockAccumulator = 0;
      drawNext();
      drawHold();

      if (collides(current.shape, current.x, current.y)) {
        gameOver = true;
        setStatus("ゲームオーバー", true);
      }
    }

    // 下に1マス落とす処理
    function stepDown() {
      if (gameOver || !matchReady) {
        return false;
      }

      const nextY = current.y + 1;
      if (!collides(current.shape, current.x, nextY)) {
        current.y = nextY;
        current.lastRotate = false;
        lockAccumulator = 0;
        return true;
      }
      return false;
    }

    // 左右移動処理
    function move(dx) {
      if (gameOver || !matchReady) {
        return;
      }

      const nextX = current.x + dx;
      if (!collides(current.shape, nextX, current.y)) {
        current.x = nextX;
        current.lastRotate = false;
        lockAccumulator = 0;
      }
    }

    // 回転時のキック候補を返す関数
    function getKickTests(type, fromRot, toRot) {
      if (type === "O") {
        return [[0, 0]];
      }
      const key = `${fromRot}>${toRot}`;
      if (type === "I") {
        return KICK_I[key] || [[0, 0]];
      }
      return KICK_JLSTZ[key] || [[0, 0]];
    }

    // SRS回転処理
    function rotate(dir) {
      if (gameOver || !matchReady) {
        return;
      }

      const fromRot = current.rotation;
      const toRot = (fromRot + (dir === 1 ? 1 : 3)) % 4;
      const rotated = dir === 1 ? rotateClockwise(current.shape) : rotateCounterClockwise(current.shape);
      const tests = getKickTests(current.type, fromRot, toRot);

      for (const [dx, dy] of tests) {
        const testX = current.x + dx;
        const testY = current.y - dy;
        if (!collides(rotated, testX, testY)) {
          current.shape = rotated;
          current.x = testX;
          current.y = testY;
          current.rotation = toRot;
          current.lastRotate = true;
          lockAccumulator = 0;
          return;
        }
      }
    }

    // ソフトドロップ処理
    function softDrop() {
      if (gameOver || !matchReady) {
        return;
      }

      const moved = stepDown();
      if (moved) {
        score += 1;
        updateStats();
      }
    }

    // ハードドロップ処理
    function hardDrop() {
      if (gameOver || !matchReady) {
        return;
      }

      let distance = 0;
      while (!collides(current.shape, current.x, current.y + 1)) {
        current.y += 1;
        distance++;
      }
      if (distance > 0) {
        current.lastRotate = false;
      }
      score += distance * 2;
      updateStats();
      lockCurrentPiece();
    }

    // ホールド処理
    function holdPiece() {
      if (gameOver || !current || !canHold || !matchReady) {
        return;
      }

      const nowType = current.type;
      if (holdType === null) {
        holdType = nowType;
        canHold = false;
        spawnPiece();
      } else {
        const swapType = holdType;
        holdType = nowType;
        canHold = false;
        spawnPiece(swapType);
      }

      drawHold();
    }

    // 統計表示更新
    function updateStats() {
      scoreEl.textContent = String(score);
      linesEl.textContent = String(clearedLines);
      levelEl.textContent = String(level);
    }

    // ステータス表示更新
    function setStatus(text, over = false) {
      statusEl.textContent = text;
      statusEl.classList.remove("playing", "over");
      statusEl.classList.add(over ? "over" : "playing");
    }

    // 盤面背景グリッド描画
    function drawGrid() {
      g.strokeStyle = "rgba(100, 116, 139, 0.15)";
      g.lineWidth = 1;

      for (let x = 0; x <= COLS; x++) {
        g.beginPath();
        g.moveTo(x * BLOCK + 0.5, 0);
        g.lineTo(x * BLOCK + 0.5, ROWS * BLOCK);
        g.stroke();
      }

      for (let y = 0; y <= ROWS; y++) {
        g.beginPath();
        g.moveTo(0, y * BLOCK + 0.5);
        g.lineTo(COLS * BLOCK, y * BLOCK + 0.5);
        g.stroke();
      }
    }

    // 盤面描画
    function drawBoard() {
      g.clearRect(0, 0, gameCanvas.width, gameCanvas.height);
      g.fillStyle = "#020617";
      g.fillRect(0, 0, gameCanvas.width, gameCanvas.height);
      drawGrid();

      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const cell = board[y][x];
          if (!cell) {
            continue;
          }
          drawCell(g, x, y, COLORS[cell], BLOCK);
        }
      }
    }

    // ゴースト描画
    function drawGhostPiece() {
      if (!current) {
        return;
      }

      const ghostY = getGhostY(current);
      for (let y = 0; y < current.shape.length; y++) {
        for (let x = 0; x < current.shape[y].length; x++) {
          if (!current.shape[y][x]) {
            continue;
          }
          const px = current.x + x;
          const py = ghostY + y;
          if (py >= 0) {
            drawCell(g, px, py, COLORS[current.type], BLOCK, 0.22);
          }
        }
      }
    }

    // 現在ピース描画
    function drawCurrentPiece() {
      if (!current) {
        return;
      }
      for (let y = 0; y < current.shape.length; y++) {
        for (let x = 0; x < current.shape[y].length; x++) {
          if (!current.shape[y][x]) {
            continue;
          }
          const px = current.x + x;
          const py = current.y + y;
          if (py >= 0) {
            drawCell(g, px, py, COLORS[current.type], BLOCK);
          }
        }
      }
    }

    // 1フレーム更新関数
    function update(time = 0) {
      if (!matchReady) {
        drawBoard();
        animationId = requestAnimationFrame(update);
        return;
      }

      if (gameOver) {
        drawBoard();
        drawGhostPiece();
        drawCurrentPiece();
        animationId = requestAnimationFrame(update);
        return;
      }

      const delta = time - lastTime;
      lastTime = time;
      dropAccumulator += delta;

      const interval = currentDropInterval();
      if (dropAccumulator >= interval) {
        stepDown();
        dropAccumulator = 0;
      }

      if (isGrounded(current)) {
        lockAccumulator += delta;
        if (lockAccumulator >= LOCK_DELAY_MS) {
          lockCurrentPiece();
        }
      } else {
        lockAccumulator = 0;
      }

      drawBoard();
      drawGhostPiece();
      drawCurrentPiece();
      animationId = requestAnimationFrame(update);
    }

    // ゲーム開始・再開始処理
    function startGame() {
      board = createBoard();
      current = null;
      score = 0;
      clearedLines = 0;
      level = 1;
      gameOver = false;
      lastTime = 0;
      dropAccumulator = 0;
      bag = [];
      nextQueue = [];
      holdType = null;
      canHold = true;
      lockAccumulator = 0;
      pendingGarbage = 0;

      ensureNextQueue(5);
      updateGarbageStock();
      updateStats();
      setStatus("対戦中", false);
      spawnPiece();
      drawNext();
      drawHold();
      drawBoard();
      drawGhostPiece();
      drawCurrentPiece();
    }

    // 待機状態へ切り替える関数
    function enterWaitingMode(message) {
      matchReady = false;
      gameOver = true;
      updateMatchInfo("待機中", false);
      setStatus(message, false);
      resetForWaiting();
    }

    // 対戦開始状態へ切り替える関数
    function enterMatchMode() {
      matchReady = true;
      updateMatchInfo("対戦中", true);
      startGame();
    }

    // キー入力処理
    window.addEventListener("keydown", (e) => {
      const key = e.key;

      if (gameOver && key !== "Shift" && key !== "c" && key !== "C") {
        return;
      }

      if (key === "ArrowLeft") {
        e.preventDefault();
        move(-1);
      } else if (key === "ArrowRight") {
        e.preventDefault();
        move(1);
      } else if (key === "ArrowUp" || key === "x" || key === "X") {
        e.preventDefault();
        rotate(1);
      } else if (key === "z" || key === "Z") {
        e.preventDefault();
        rotate(-1);
      } else if (key === "ArrowDown") {
        e.preventDefault();
        softDrop();
      } else if (key === " ") {
        e.preventDefault();
        hardDrop();
      } else if (key === "Shift" || key === "c" || key === "C") {
        e.preventDefault();
        holdPiece();
      }

      drawBoard();
      drawGhostPiece();
      drawCurrentPiece();
    });

    // リスタートボタン処理
    restartBtn.addEventListener("click", () => {
      if (!matchReady) {
        setStatus("対戦相手を待っています", false);
        return;
      }
      startGame();
    });

    // デバッグ用レベルアップボタン処理
    levelUpBtn.addEventListener("click", () => {
      if (gameOver || !matchReady) {
        return;
      }

      level += 1;
      clearedLines = Math.max(clearedLines, (level - 1) * LEVEL_LINES);
      updateStats();
      setStatus(`デバッグ: レベル${level}`, false);
    });

    // 接続完了時の処理
    socket.on("connect", () => {
      setStatus("マッチング中...", false);
    });

    // 待機状態通知の処理
    socket.on("waiting", (payload) => {
      roomId = payload.roomId;
      playerNumber = payload.playerNumber;
      updateMatchInfo("待機中", false);
      enterWaitingMode("対戦相手を待っています...");
    });

    // 対戦開始通知の処理
    socket.on("matchStart", (payload) => {
      roomId = payload.roomId;
      playerNumber = payload.playerNumber;
      updateMatchInfo("対戦中", true);
      enterMatchMode();
    });

    // おじゃまライン受信時の処理
    socket.on("receiveGarbage", (payload) => {
      const count = Number(payload?.count || 0);
      if (!Number.isFinite(count) || count <= 0) {
        return;
      }
      pendingGarbage += count;
      updateGarbageStock();
      setStatus(`おじゃま ${count} ライン受信`, false);
    });

    // 相手切断時の処理
    socket.on("opponentLeft", () => {
      enterWaitingMode("相手が切断しました。次の相手を待っています...");
    });

    // 初期描画とループ開始
    resetForWaiting();
    updateMatchInfo("待機中", false);
    updateStats();
    update();
  </script>
</body>
</html>
