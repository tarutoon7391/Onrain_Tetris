<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>オンラインゲームセンター</title>
  <style>
    :root {
      --bg: #111827;
      --panel: #1f2937;
      --text: #e5e7eb;
      --accent: #60a5fa;
      --border: #374151;
      --danger: #ef4444;
      --ok: #22c55e;
      --warn: #f59e0b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background: radial-gradient(circle at top, #1f2937 0%, #0b1020 65%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* 各画面共通のラッパー */
    .screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 400px;
    }

    /* ログイン・ロビー・勝敗画面のカード */
    .card {
      background: linear-gradient(180deg, rgba(31, 41, 55, 0.98), rgba(17, 24, 39, 0.98));
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 48px 40px;
      width: 100%;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    .card h1 {
      font-size: 1.6rem;
      margin: 0 0 32px;
      color: var(--accent);
      letter-spacing: 0.06em;
    }

    .card h2 {
      margin: 0 0 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.7);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      box-sizing: border-box;
    }

    .form-group input[type="text"]:focus {
      border-color: var(--accent);
    }

    .card button {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      margin-bottom: 0;
    }

    .card .greeting {
      font-size: 1.15rem;
      margin: 0 0 28px;
      color: var(--text);
    }

    .card .matching-status {
      margin-top: 16px;
      font-size: 0.9rem;
      color: #fde68a;
      min-height: 1.4em;
    }

    /* 勝敗テキスト */
    .result-win {
      font-size: 2.6rem;
      font-weight: 900;
      color: var(--ok);
      margin: 0 0 32px;
    }

    .result-lose {
      font-size: 2.6rem;
      font-weight: 900;
      color: var(--danger);
      margin: 0 0 32px;
    }

    /* ゲーム画面のプレイヤー名バー */
    #playerNamesBar {
      grid-column: 1 / -1;
      text-align: center;
      font-size: 1rem;
      font-weight: 700;
      padding: 8px 12px;
      background: rgba(31, 41, 55, 0.9);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
    }

    #myNameDisplay {
      color: var(--accent);
    }

    #opponentNameDisplay {
      color: var(--warn);
    }

    .app {
      width: min(1040px, 100%);
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 18px;
      background: rgba(17, 24, 39, 0.78);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      backdrop-filter: blur(2px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
    }

    .left {
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .right {
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .panel {
      background: linear-gradient(180deg, rgba(31, 41, 55, 0.95), rgba(17, 24, 39, 0.95));
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }

    h1 {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: 0.04em;
      color: #fff;
    }

    .stats {
      display: grid;
      gap: 8px;
      font-size: 0.95rem;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed rgba(148, 163, 184, 0.25);
      padding-bottom: 6px;
    }

    .stat:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .value {
      color: var(--accent);
      font-weight: 700;
      min-width: 5.2em;
      text-align: right;
    }

    #game {
      display: block;
      width: 300px;
      height: 600px;
      border: 2px solid #64748b;
      border-radius: 8px;
      background: #030712;
    }

    /* 相手の盤面（小サイズ）*/
    #opponentGame {
      display: block;
      width: 150px;
      height: 300px;
      border: 2px solid #64748b;
      border-radius: 8px;
      background: #030712;
      margin-top: 8px;
    }

    #next1,
    #hold {
      display: block;
      width: 120px;
      height: 120px;
      border: 2px solid #64748b;
      border-radius: 8px;
      background: #030712;
      margin-top: 8px;
    }

    .next-small-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin-top: 4px;
    }

    #next2,
    #next3,
    #next4,
    #next5 {
      display: block;
      width: 70px;
      height: 70px;
      border: 2px solid #64748b;
      border-radius: 6px;
      background: #030712;
    }

    .status {
      min-height: 1.5em;
      font-size: 0.95rem;
      color: #bfdbfe;
    }

    .status.over {
      color: var(--danger);
      font-weight: 700;
    }

    .status.playing {
      color: var(--ok);
      font-weight: 700;
    }

    .match-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
      font-size: 0.93rem;
    }

    .match-line strong {
      color: #f8fafc;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      background: rgba(96, 165, 250, 0.16);
      color: #bfdbfe;
    }

    .badge.waiting {
      background: rgba(245, 158, 11, 0.18);
      color: #fde68a;
    }

    .badge.playing {
      background: rgba(34, 197, 94, 0.18);
      color: #86efac;
    }

    .controls {
      line-height: 1.75;
      font-size: 0.9rem;
      color: #cbd5e1;
    }

    .controls span {
      color: #f8fafc;
      font-weight: 600;
    }

    button {
      cursor: pointer;
      border: 1px solid #3b82f6;
      color: white;
      background: linear-gradient(180deg, #3b82f6, #2563eb);
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 10px 12px;
    }

    button:hover {
      filter: brightness(1.08);
    }

    button:active {
      transform: translateY(1px);
    }

    @media (max-width: 820px) {
      .app {
        grid-template-columns: 1fr;
      }

      .left {
        justify-items: center;
      }

      .panel {
        width: 100%;
      }
    }

    /* ===== 演出エフェクト ===== */

    /* 画面フラッシュオーバーレイ */
    #flashOverlay {
      position: fixed;
      inset: 0;
      background: #ef4444;
      pointer-events: none;
      z-index: 9998;
      opacity: 0;
    }

    /* 赤フラッシュアニメーション */
    @keyframes redFlash {
      0%   { opacity: 0.65; }
      100% { opacity: 0; }
    }

    #flashOverlay.flash-active {
      animation: redFlash 0.5s ease-out forwards;
    }

    /* ダメージテキストポップアップ */
    @keyframes floatUp {
      0%   { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
      60%  { opacity: 1; transform: translateX(-50%) translateY(-50px) scale(1.15); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-90px) scale(1.2); }
    }

    .damage-popup {
      position: fixed;
      font-size: 2rem;
      font-weight: 900;
      color: #facc15;
      text-shadow: 0 0 12px rgba(250, 204, 21, 0.9), 2px 2px 6px rgba(0, 0, 0, 0.95);
      pointer-events: none;
      z-index: 9999;
      animation: floatUp 1.3s ease-out forwards;
      white-space: nowrap;
    }

    /* シェイクアニメーション */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      15%      { transform: translateX(-8px); }
      30%      { transform: translateX(8px); }
      45%      { transform: translateX(-6px); }
      60%      { transform: translateX(6px); }
      75%      { transform: translateX(-3px); }
      90%      { transform: translateX(3px); }
    }

    .shake {
      animation: shake 0.45s ease-out;
    }

    /* ===== ゲームセンター風ロビースタイル ===== */

    /* ネオンフリッカーアニメーション */
    @keyframes neonFlicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
        text-shadow:
          0 0 6px #fff,
          0 0 14px #fff,
          0 0 26px #f0f,
          0 0 40px #f0f,
          0 0 60px #f0f;
        opacity: 1;
      }
      20%, 24%, 55% {
        text-shadow: none;
        opacity: 0.85;
      }
    }

    /* ロビーカード専用スタイル */
    #lobbyScreen .card {
      max-width: 440px;
      background: linear-gradient(160deg, rgba(10,5,30,0.97) 0%, rgba(20,10,50,0.97) 100%);
      border: 1px solid rgba(160, 80, 255, 0.5);
      box-shadow:
        0 0 18px rgba(160, 80, 255, 0.25),
        0 12px 32px rgba(0,0,0,0.6);
    }

    /* ゲームセンター風タイトル */
    .arcade-title {
      font-size: 1.7rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      color: #fff;
      text-transform: uppercase;
      animation: neonFlicker 5s infinite alternate;
      margin: 0 0 6px;
    }

    .arcade-subtitle {
      font-size: 0.82rem;
      color: rgba(200, 160, 255, 0.75);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin: 0 0 28px;
    }

    /* グリーティングテキスト */
    .arcade-greeting {
      font-size: 0.95rem;
      color: rgba(200, 200, 255, 0.8);
      margin: 0 0 24px;
      letter-spacing: 0.04em;
    }

    /* ゲーム選択ボタン共通 */
    .game-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 14px 18px;
      margin-bottom: 12px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      border: 1px solid transparent;
      transition: filter 0.15s, transform 0.1s;
      text-align: left;
    }

    .game-btn:last-of-type {
      margin-bottom: 0;
    }

    .game-btn:hover {
      filter: brightness(1.15);
    }

    .game-btn:active {
      transform: translateY(1px);
    }

    .game-btn .btn-icon {
      font-size: 1.5rem;
      line-height: 1;
    }

    .game-btn .btn-label {
      flex: 1;
    }

    .game-btn .btn-tag {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.15);
      letter-spacing: 0.06em;
    }

    /* テトリスボタン */
    .btn-tetris {
      background: linear-gradient(135deg, #1d4ed8, #3b82f6);
      border-color: rgba(96, 165, 250, 0.5);
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
    }

    /* ブロックブラストボタン */
    .btn-blockblast {
      background: linear-gradient(135deg, #6d28d9, #a855f7);
      border-color: rgba(168, 85, 247, 0.5);
      box-shadow: 0 4px 14px rgba(168, 85, 247, 0.35);
    }

    /* タイピングバトルボタン */
    .btn-typing {
      background: linear-gradient(135deg, #065f46, #10b981);
      border-color: rgba(16, 185, 129, 0.5);
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }

    /* カードゲームボタン */
    .btn-cardgame {
      background: linear-gradient(135deg, #92400e, #f59e0b);
      border-color: rgba(245, 158, 11, 0.5);
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
    }

    /* マッチング状況テキスト */
    .arcade-matching-status {
      margin-top: 18px;
      font-size: 0.88rem;
      color: #fde68a;
      min-height: 1.4em;
      letter-spacing: 0.04em;
    }

    /* ログイン画面タイトル */
    #loginScreen .card h1 {
      font-size: 1.5rem;
      letter-spacing: 0.08em;
    }

    /* ゲーム内タイトル */
    #gameScreen .panel h1 {
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <!-- 画面フラッシュ用オーバーレイ -->
  <div id="flashOverlay"></div>

  <!-- ログイン画面 -->
  <div id="loginScreen" class="screen">
    <div class="card">
      <h1>🕹️ オンラインゲームセンター</h1>
      <div class="form-group">
        <input id="nameInput" type="text" maxlength="20" placeholder="プレイヤー名を入力" autocomplete="off" />
      </div>
      <button id="loginBtn" type="button">ログイン</button>
    </div>
  </div>

  <!-- ロビー画面 -->
  <div id="lobbyScreen" class="screen" style="display:none">
    <div class="card">
      <div class="arcade-title">🕹️ Game Center</div>
      <div class="arcade-subtitle">オンラインゲームセンター</div>
      <p id="greeting" class="arcade-greeting"></p>
      <button id="matchBtn" type="button" class="game-btn btn-tetris">
        <span class="btn-icon">🎮</span>
        <span class="btn-label">テトリスで対戦</span>
        <span class="btn-tag">TETRIS</span>
      </button>
      <button id="matchBBBtn" type="button" class="game-btn btn-blockblast">
        <span class="btn-icon">🧩</span>
        <span class="btn-label">ブロックブラストで対戦</span>
        <span class="btn-tag">BLOCK BLAST</span>
      </button>
      <button id="matchTypingBtn" type="button" class="game-btn btn-typing">
        <span class="btn-icon">⌨️</span>
        <span class="btn-label">タイピングバトル</span>
        <span class="btn-tag">TYPING</span>
      </button>
      <button id="matchCardBtn" type="button" class="game-btn btn-cardgame">
        <span class="btn-icon">🃏</span>
        <span class="btn-label">カードゲーム</span>
        <span class="btn-tag">CARD GAME</span>
      </button>
      <p id="matchingStatus" class="arcade-matching-status"></p>
    </div>
  </div>

  <!-- ゲーム画面 -->
  <div class="app" id="gameScreen" style="display:none">
    <div id="playerNamesBar">
      <span id="myNameDisplay"></span>　vs　<span id="opponentNameDisplay"></span>
    </div>
    <div class="left">
      <canvas id="game" width="300" height="600" aria-label="テトリス盤面"></canvas>
      <div class="status" id="status">対戦中</div>
      <button id="restartBtn" type="button">リスタート</button>
      <button id="levelUpBtn" type="button">デバッグ: レベル+1</button>
    </div>

    <div class="right">
      <div class="panel">
        <h1>🕹️ オンラインゲームセンター</h1>
      </div>

      <!-- 相手の盤面パネル -->
      <div class="panel">
        <div>相手の盤面（<span id="opponentNameLabel"></span>）</div>
        <canvas id="opponentGame" width="150" height="300" aria-label="相手のテトリス盤面"></canvas>
      </div>

      <div class="panel">
        <div class="match-line"><strong>対戦状態</strong><span id="matchBadge" class="badge waiting">待機中</span></div>
        <div class="match-line"><span>ルームID</span><span id="roomId">-</span></div>
        <div class="match-line"><span>プレイヤー番号</span><span id="playerNumber">-</span></div>
        <div class="match-line"><span>受信おじゃま</span><span id="garbageStock">0</span></div>
      </div>

      <div class="panel stats">
        <div class="stat"><span>スコア</span><span class="value" id="score">0</span></div>
        <div class="stat"><span>消去ライン</span><span class="value" id="lines">0</span></div>
        <div class="stat"><span>レベル</span><span class="value" id="level">1</span></div>
      </div>

      <div class="panel">
        <div>ネクスト</div>
        <canvas id="next1" width="120" height="120" aria-label="次のピース1"></canvas>
        <div class="next-small-grid">
          <canvas id="next2" width="70" height="70" aria-label="次のピース2"></canvas>
          <canvas id="next3" width="70" height="70" aria-label="次のピース3"></canvas>
          <canvas id="next4" width="70" height="70" aria-label="次のピース4"></canvas>
          <canvas id="next5" width="70" height="70" aria-label="次のピース5"></canvas>
        </div>
      </div>

      <div class="panel">
        <div>ホールド</div>
        <canvas id="hold" width="120" height="120" aria-label="ホールドピース"></canvas>
      </div>

      <div class="panel controls">
        <div><span>← →</span> : 左右移動</div>
        <div><span>↑ / X</span> : 時計回り回転</div>
        <div><span>Z</span> : 反時計回り回転</div>
        <div><span>↓</span> : ソフトドロップ</div>
        <div><span>スペース</span> : ハードドロップ</div>
        <div><span>Shift / C</span> : ホールド</div>
      </div>
    </div>
  </div>

  <!-- 勝敗画面 -->
  <div id="resultScreen" class="screen" style="display:none">
    <div class="card">
      <p id="resultText"></p>
      <button id="backToLobbyBtn" type="button">ロビーに戻る</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // Socket.ioへ接続する
    const socket = io();

    // 盤面サイズと描画サイズの定義
    const COLS = 10;
    const ROWS = 20;
    const BLOCK = 30;
    // 相手盤面の1マスサイズ（自分の半分）
    const OPPONENT_BLOCK = 15;
    // 盤面データ送信のスロットル間隔（ミリ秒）
    const BOARD_SEND_INTERVAL = 100;

    // 落下速度制御の定義
    const BASE_DROP_MS = 800;
    const MIN_DROP_MS = 80;
    const LEVEL_LINES = 10;
    const LEVEL_SPEED_RATIO = 0.86;
    const LOCK_DELAY_MS = 450;

    // スコア倍率の定義
    const SCORE_MULTIPLIER = {
      1: 1,
      2: 3,
      3: 5,
      4: 8,
    };

    // T-Spin成立時のスコア定義
    const T_SPIN_SCORE = {
      0: 400,
      1: 800,
      2: 1200,
      3: 1600,
    };

    // 各テトリミノの形状データ
    const SHAPES = {
      I: [[1, 1, 1, 1]],
      O: [
        [1, 1],
        [1, 1],
      ],
      T: [
        [0, 1, 0],
        [1, 1, 1],
        [0, 0, 0],
      ],
      S: [
        [0, 1, 1],
        [1, 1, 0],
      ],
      Z: [
        [1, 1, 0],
        [0, 1, 1],
      ],
      J: [
        [1, 0, 0],
        [1, 1, 1],
      ],
      L: [
        [0, 0, 1],
        [1, 1, 1],
      ],
    };

    // 各テトリミノの色定義
    const COLORS = {
      I: "#22d3ee",
      O: "#facc15",
      S: "#4ade80",
      Z: "#f87171",
      J: "#60a5fa",
      L: "#fb923c",
      T: "#a78bfa",
      G: "#6b7280",
    };

    // 生成対象の定義
    const PIECES = ["I", "O", "T", "S", "Z", "J", "L"];

    // SRSキックテーブル（J/L/S/T/Z用）
    const KICK_JLSTZ = {
      "0>1": [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],
      "1>0": [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
      "1>2": [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
      "2>1": [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],
      "2>3": [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]],
      "3>2": [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
      "3>0": [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
      "0>3": [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]],
    };

    // SRSキックテーブル（I用）
    const KICK_I = {
      "0>1": [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]],
      "1>0": [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]],
      "1>2": [[0, 0], [-1, 0], [2, 0], [-1, 2], [2, -1]],
      "2>1": [[0, 0], [1, 0], [-2, 0], [1, -2], [-2, 1]],
      "2>3": [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]],
      "3>2": [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]],
      "3>0": [[0, 0], [1, 0], [-2, 0], [1, -2], [-2, 1]],
      "0>3": [[0, 0], [-1, 0], [2, 0], [-1, 2], [2, -1]],
    };

    // CanvasとUI要素の参照
    const gameCanvas = document.getElementById("game");
    const next1Canvas = document.getElementById("next1");
    const next2Canvas = document.getElementById("next2");
    const next3Canvas = document.getElementById("next3");
    const next4Canvas = document.getElementById("next4");
    const next5Canvas = document.getElementById("next5");
    const holdCanvas = document.getElementById("hold");
    const opponentGameCanvas = document.getElementById("opponentGame");
    const g = gameCanvas.getContext("2d");
    const n1 = next1Canvas.getContext("2d");
    const n2 = next2Canvas.getContext("2d");
    const n3 = next3Canvas.getContext("2d");
    const n4 = next4Canvas.getContext("2d");
    const n5 = next5Canvas.getContext("2d");
    const h = holdCanvas.getContext("2d");
    const og = opponentGameCanvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const linesEl = document.getElementById("lines");
    const levelEl = document.getElementById("level");
    const statusEl = document.getElementById("status");
    const restartBtn = document.getElementById("restartBtn");
    const levelUpBtn = document.getElementById("levelUpBtn");
    const matchBadgeEl = document.getElementById("matchBadge");
    const roomIdEl = document.getElementById("roomId");
    const playerNumberEl = document.getElementById("playerNumber");
    const garbageStockEl = document.getElementById("garbageStock");

    // ゲーム状態を保持する変数
    let board = [];
    let current = null;
    let score = 0;
    let clearedLines = 0;
    let level = 1;
    let gameOver = false;
    let lastTime = 0;
    let dropAccumulator = 0;
    let animationId = null;
    let bag = [];
    let nextQueue = [];
    let holdType = null;
    let canHold = true;
    let lockAccumulator = 0;
    let roomId = "";
    let playerNumber = 0;
    let matchReady = false;
    let pendingGarbage = 0;

    // プレイヤー名を保持する変数
    let myPlayerName = "";
    let opponentPlayerName = "";

    // 相手の盤面データを保持する変数
    let opponentBoard = null;
    // 盤面データを最後に送信した時刻
    let lastBoardSendTime = 0;

    // ===== 演出エフェクト用変数 =====
    // パーティクルの配列
    let particles = [];
    // ラインフラッシュの対象行インデックス
    let lineFlashRows = [];
    // ラインフラッシュの終了時刻（DOMHighResTimeStamp）
    let lineFlashEndTime = 0;

    // 盤面を空で初期化する関数
    function createBoard() {
      return Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    }

    // 配列を複製する関数
    function cloneMatrix(matrix) {
      return matrix.map((row) => row.slice());
    }

    // Fisher-Yatesでシャッフルする関数
    function shuffle(array) {
      const result = array.slice();
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = result[i];
        result[i] = result[j];
        result[j] = tmp;
      }
      return result;
    }

    // 7バッグを補充する関数
    function refillBag() {
      bag = shuffle(PIECES);
    }

    // NEXTキューを必要数まで補充する関数
    function ensureNextQueue(minCount = 5) {
      while (nextQueue.length < minCount) {
        if (bag.length === 0) {
          refillBag();
        }
        nextQueue.push(bag.shift());
      }
    }

    // 新しいピースを生成する関数
    function createPiece(type) {
      const shape = cloneMatrix(SHAPES[type]);
      const x = Math.floor((COLS - shape[0].length) / 2);
      const y = 0;
      return { type, shape, x, y, rotation: 0, lastRotate: false };
    }

    // 行列を時計回りに回転する関数
    function rotateClockwise(matrix) {
      const rows = matrix.length;
      const cols = matrix[0].length;
      const rotated = Array.from({ length: cols }, () => Array(rows).fill(0));
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          rotated[x][rows - 1 - y] = matrix[y][x];
        }
      }
      return rotated;
    }

    // 行列を反時計回りに回転する関数
    function rotateCounterClockwise(matrix) {
      const rows = matrix.length;
      const cols = matrix[0].length;
      const rotated = Array.from({ length: cols }, () => Array(rows).fill(0));
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          rotated[cols - 1 - x][y] = matrix[y][x];
        }
      }
      return rotated;
    }

    // 位置衝突を判定する関数
    function collides(matrix, offsetX, offsetY) {
      for (let y = 0; y < matrix.length; y++) {
        for (let x = 0; x < matrix[y].length; x++) {
          if (!matrix[y][x]) {
            continue;
          }
          const bx = offsetX + x;
          const by = offsetY + y;

          if (bx < 0 || bx >= COLS || by >= ROWS) {
            return true;
          }
          if (by >= 0 && board[by][bx]) {
            return true;
          }
        }
      }
      return false;
    }

    // ピースを盤面へ固定する関数
    function mergePiece() {
      const { shape, x: offsetX, y: offsetY, type } = current;
      for (let y = 0; y < shape.length; y++) {
        for (let x = 0; x < shape[y].length; x++) {
          if (!shape[y][x]) {
            continue;
          }
          const by = offsetY + y;
          const bx = offsetX + x;
          if (by >= 0) {
            board[by][bx] = type;
          }
        }
      }
    }

    // 揃ったラインを消去し、消去数と消去前の行インデックスを返す関数
    function clearLines() {
      let removed = 0;
      // 消去した行のインデックスを記録する（演出用）
      const clearedRowIndices = [];

      for (let y = ROWS - 1; y >= 0; y--) {
        const filled = board[y].every((cell) => cell !== 0);
        if (!filled) {
          continue;
        }

        clearedRowIndices.push(y);
        board.splice(y, 1);
        board.unshift(Array(COLS).fill(0));
        removed++;
        y++;
      }

      return { removed, clearedRowIndices };
    }

    // T-Spin成立判定（簡易版）
    function isTSpin(piece) {
      if (!piece || piece.type !== "T" || !piece.lastRotate) {
        return false;
      }

      const pivotX = piece.x + 1;
      const pivotY = piece.y + 1;
      const corners = [
        [pivotX - 1, pivotY - 1],
        [pivotX + 1, pivotY - 1],
        [pivotX - 1, pivotY + 1],
        [pivotX + 1, pivotY + 1],
      ];

      let blocked = 0;
      for (const [cx, cy] of corners) {
        if (cx < 0 || cx >= COLS || cy < 0 || cy >= ROWS) {
          blocked++;
          continue;
        }
        if (board[cy][cx] !== 0) {
          blocked++;
        }
      }

      return blocked >= 3;
    }

    // 2ライン以上消したときのおじゃま量を計算する関数
    function calculateGarbageLines(removed, tSpin) {
      if (tSpin) {
        if (removed === 1) {
          return 2;
        }
        if (removed === 2) {
          return 4;
        }
        if (removed >= 3) {
          return 6;
        }
        return 0;
      }

      if (removed === 2) {
        return 1;
      }
      if (removed === 3) {
        return 2;
      }
      if (removed >= 4) {
        return 4;
      }
      return 0;
    }

    // スコアとレベルを更新する関数
    function applyScore(removed, tSpin = false) {
      if (tSpin) {
        const tSpinBase = T_SPIN_SCORE[removed] ?? T_SPIN_SCORE[0];
        score += tSpinBase * level;
      } else if (removed > 0) {
        const mul = SCORE_MULTIPLIER[removed] ?? 0;
        score += removed * 100 * mul * level;
      }

      clearedLines += removed;
      level = Math.floor(clearedLines / LEVEL_LINES) + 1;
      updateStats();

      if (tSpin) {
        const labels = ["T-Spin", "T-Spin Single", "T-Spin Double", "T-Spin Triple"];
        setStatus(labels[removed] ?? "T-Spin", false);
      } else if (removed > 0) {
        setStatus(`${removed}ライン消去`, false);
      }
    }
    // 現在レベルに応じた落下間隔を返す関数
    function currentDropInterval() {
      const speed = Math.floor(BASE_DROP_MS * Math.pow(LEVEL_SPEED_RATIO, level - 1));
      return Math.max(MIN_DROP_MS, speed);
    }

    // 接地しているかを判定する関数
    function isGrounded(piece) {
      return piece ? collides(piece.shape, piece.x, piece.y + 1) : false;
    }

    // サーバーへゲームオーバーを通知する関数
    function notifyGameOver() {
      if (roomId && matchReady) {
        socket.emit("gameOver");
        matchReady = false;
      }
    }

    // 受け取ったおじゃまラインを盤面へ反映する関数
    function applyPendingGarbage() {
      if (pendingGarbage <= 0 || gameOver) {
        return;
      }

      const amount = pendingGarbage;
      pendingGarbage = 0;
      updateGarbageStock();

      for (let i = 0; i < amount; i++) {
        board.shift();
        const row = Array(COLS).fill("G");
        row[Math.floor(Math.random() * COLS)] = 0;
        board.push(row);
      }

      if (board[0].some((cell) => cell !== 0)) {
        gameOver = true;
        setStatus("おじゃまでゲームオーバー", true);
        notifyGameOver();
      }
    }

    // ===== 演出エフェクト関数 =====

    // カラフルなパーティクルを指定行に生成する
    function spawnParticles(rowIndices) {
      const colors = ["#ff6b6b", "#ffd93d", "#6bcb77", "#4d96ff", "#e040fb", "#ff9f1c", "#ffffff"];
      rowIndices.forEach((row) => {
        for (let x = 0; x < COLS; x++) {
          for (let i = 0; i < 4; i++) {
            particles.push({
              x: (x + Math.random()) * BLOCK,
              y: (row + Math.random()) * BLOCK,
              vx: (Math.random() - 0.5) * 7,
              vy: (Math.random() - 1.8) * 5,
              color: colors[Math.floor(Math.random() * colors.length)],
              life: 1.0,
              decay: 0.035 + Math.random() * 0.03,
              size: 2 + Math.random() * 4,
            });
          }
        }
      });
    }

    // パーティクルを更新して盤面キャンバスに描画する
    function updateAndDrawParticles() {
      particles = particles.filter((p) => p.life > 0);
      particles.forEach((p) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.25; // 重力
        p.life -= p.decay;
        g.save();
        g.globalAlpha = Math.max(0, p.life);
        g.fillStyle = p.color;
        g.beginPath();
        g.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        g.fill();
        g.restore();
      });
    }

    // ラインフラッシュを開始する（消えるライン行を白く光らせる）
    function triggerLineFlash(rows) {
      lineFlashRows = rows.slice();
      lineFlashEndTime = performance.now() + 220;
    }

    // ラインフラッシュを盤面キャンバスに描画する（drawBoard直後に呼ぶ）
    function drawLineFlash(now) {
      if (lineFlashRows.length === 0 || now > lineFlashEndTime) return;
      const alpha = ((lineFlashEndTime - now) / 220) * 0.9;
      g.save();
      g.globalAlpha = alpha;
      g.fillStyle = "#ffffff";
      lineFlashRows.forEach((y) => {
        g.fillRect(0, y * BLOCK, COLS * BLOCK, BLOCK);
      });
      g.restore();
    }

    // ダメージテキストをゲームキャンバスの上にポップアップ表示する
    function showDamagePopup(text, canvasEl) {
      const rect = canvasEl.getBoundingClientRect();
      const popup = document.createElement("div");
      popup.className = "damage-popup";
      popup.textContent = text;
      popup.style.left = `${rect.left + rect.width / 2}px`;
      popup.style.top = `${rect.top + 50}px`;
      document.body.appendChild(popup);
      // アニメーション終了後に要素を削除する
      popup.addEventListener("animationend", () => popup.remove());
    }

    // 画面全体を赤くフラッシュさせる
    function triggerScreenFlash() {
      const overlay = document.getElementById("flashOverlay");
      overlay.classList.remove("flash-active");
      // リフロー強制でアニメーションをリセットする
      void overlay.offsetWidth;
      overlay.classList.add("flash-active");
    }

    // 指定要素をシェイクさせる
    function triggerShake(elementId) {
      const el = document.getElementById(elementId);
      if (!el) return;
      el.classList.remove("shake");
      // リフロー強制でアニメーションをリセットする
      void el.offsetWidth;
      el.classList.add("shake");
      el.addEventListener("animationend", () => el.classList.remove("shake"), { once: true });
    }

    // ライン消去演出をまとめて発動する
    function triggerLineClearEffect(clearedRowIndices, garbageCount, removed) {
      // 1. 消えるラインをフラッシュさせる
      triggerLineFlash(clearedRowIndices);
      // 2. パーティクルを飛び散らせる
      spawnParticles(clearedRowIndices);
      // 3. おじゃまライン数またはライン消去数をポップアップ表示する
      if (garbageCount > 0) {
        showDamagePopup(`-${garbageCount} おじゃま`, gameCanvas);
      } else {
        showDamagePopup(`${removed}ライン！`, gameCanvas);
      }
    }

    // 現在ピースを固定して次へ進める関数
    function lockCurrentPiece() {
      const tSpin = isTSpin(current);
      mergePiece();
      const { removed, clearedRowIndices } = clearLines();
      applyScore(removed, tSpin);

      const sendCount = calculateGarbageLines(removed, tSpin);
      if (sendCount > 0 && roomId) {
        socket.emit("garbageLines", {
          roomId,
          count: sendCount,
        });
      }

      // ライン消去演出を発動する
      if (removed > 0) {
        triggerLineClearEffect(clearedRowIndices, sendCount, removed);
      }

      canHold = true;
      lockAccumulator = 0;
      applyPendingGarbage();

      if (!gameOver) {
        spawnPiece();
      }
    }

    // 1マス描画関数
    function drawCell(ctx, x, y, color, size, alpha = 1) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      ctx.fillRect(x * size, y * size, size, size);
      ctx.strokeStyle = "rgba(15, 23, 42, 0.7)";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(x * size + 0.5, y * size + 0.5, size - 1, size - 1);
      ctx.fillStyle = "rgba(255,255,255,0.14)";
      ctx.fillRect(x * size + 2, y * size + 2, size - 6, Math.max(3, Math.floor(size * 0.16)));
      ctx.restore();
    }

    // プレビューキャンバスを初期化する関数
    function clearPreview(ctx, canvas) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // 指定Canvasへ1つのピースを描画する関数
    function drawPiecePreview(ctx, canvas, type) {
      clearPreview(ctx, canvas);
      if (!type) {
        return;
      }

      const shape = SHAPES[type];
      const size = Math.min(Math.floor((Math.min(canvas.width, canvas.height) - 4) / 4), 24);
      const shapeW = shape[0].length * size;
      const shapeH = shape.length * size;
      const startX = Math.floor((canvas.width - shapeW) / 2 / size);
      const startY = Math.floor((canvas.height - shapeH) / 2 / size);

      for (let y = 0; y < shape.length; y++) {
        for (let x = 0; x < shape[y].length; x++) {
          if (shape[y][x]) {
            drawCell(ctx, startX + x, startY + y, COLORS[type], size);
          }
        }
      }
    }

    // NEXT表示を更新する関数
    function drawNext() {
      drawPiecePreview(n1, next1Canvas, nextQueue[0] || null);
      drawPiecePreview(n2, next2Canvas, nextQueue[1] || null);
      drawPiecePreview(n3, next3Canvas, nextQueue[2] || null);
      drawPiecePreview(n4, next4Canvas, nextQueue[3] || null);
      drawPiecePreview(n5, next5Canvas, nextQueue[4] || null);
    }

    // HOLD表示を更新する関数
    function drawHold() {
      drawPiecePreview(h, holdCanvas, holdType);
    }

    // ゴーストのY座標を求める関数
    function getGhostY(piece) {
      let ghostY = piece.y;
      while (!collides(piece.shape, piece.x, ghostY + 1)) {
        ghostY++;
      }
      return ghostY;
    }

    // 対戦状態を表示する関数
    function updateMatchInfo(label, playing = false) {
      matchBadgeEl.textContent = label;
      matchBadgeEl.classList.remove("waiting", "playing");
      matchBadgeEl.classList.add(playing ? "playing" : "waiting");
      roomIdEl.textContent = roomId || "-";
      playerNumberEl.textContent = playerNumber ? String(playerNumber) : "-";
    }

    // 受信おじゃま数を表示する関数
    function updateGarbageStock() {
      garbageStockEl.textContent = String(pendingGarbage);
    }

    // 相手の盤面を描画する関数
    function drawOpponentBoard() {
      og.clearRect(0, 0, opponentGameCanvas.width, opponentGameCanvas.height);
      og.fillStyle = "#020617";
      og.fillRect(0, 0, opponentGameCanvas.width, opponentGameCanvas.height);

      // グリッドを描画する
      og.strokeStyle = "rgba(100, 116, 139, 0.15)";
      og.lineWidth = 0.5;
      for (let x = 0; x <= COLS; x++) {
        og.beginPath();
        og.moveTo(x * OPPONENT_BLOCK + 0.5, 0);
        og.lineTo(x * OPPONENT_BLOCK + 0.5, ROWS * OPPONENT_BLOCK);
        og.stroke();
      }
      for (let y = 0; y <= ROWS; y++) {
        og.beginPath();
        og.moveTo(0, y * OPPONENT_BLOCK + 0.5);
        og.lineTo(COLS * OPPONENT_BLOCK, y * OPPONENT_BLOCK + 0.5);
        og.stroke();
      }

      // 相手盤面のセルを描画する
      if (!opponentBoard) {
        return;
      }
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const cell = opponentBoard[y][x];
          if (!cell) {
            continue;
          }
          drawCell(og, x, y, COLORS[cell] || COLORS.G, OPPONENT_BLOCK);
        }
      }
    }

    // 盤面や表示を待機状態へ戻す関数
    function resetForWaiting() {
      board = createBoard();
      current = null;
      nextQueue = [];
      holdType = null;
      pendingGarbage = 0;
      opponentBoard = null;
      updateGarbageStock();
      drawBoard();
      drawOpponentBoard();
      drawPiecePreview(n1, next1Canvas, null);
      drawPiecePreview(n2, next2Canvas, null);
      drawPiecePreview(n3, next3Canvas, null);
      drawPiecePreview(n4, next4Canvas, null);
      drawPiecePreview(n5, next5Canvas, null);
      drawPiecePreview(h, holdCanvas, null);
    }

    // 次ピース情報を使って新しい現在ピースを出す関数
    function spawnPiece(forcedType = null) {
      ensureNextQueue(5);

      const pieceType = forcedType ?? nextQueue.shift();
      ensureNextQueue(5);

      current = createPiece(pieceType);
      lockAccumulator = 0;
      drawNext();
      drawHold();

      if (collides(current.shape, current.x, current.y)) {
        gameOver = true;
        setStatus("ゲームオーバー", true);
        notifyGameOver();
      }
    }

    // 下に1マス落とす処理
    function stepDown() {
      if (gameOver || !matchReady) {
        return false;
      }

      const nextY = current.y + 1;
      if (!collides(current.shape, current.x, nextY)) {
        current.y = nextY;
        current.lastRotate = false;
        lockAccumulator = 0;
        return true;
      }
      return false;
    }

    // 左右移動処理
    function move(dx) {
      if (gameOver || !matchReady) {
        return;
      }

      const nextX = current.x + dx;
      if (!collides(current.shape, nextX, current.y)) {
        current.x = nextX;
        current.lastRotate = false;
        lockAccumulator = 0;
      }
    }

    // 回転時のキック候補を返す関数
    function getKickTests(type, fromRot, toRot) {
      if (type === "O") {
        return [[0, 0]];
      }
      const key = `${fromRot}>${toRot}`;
      if (type === "I") {
        return KICK_I[key] || [[0, 0]];
      }
      return KICK_JLSTZ[key] || [[0, 0]];
    }

    // SRS回転処理
    function rotate(dir) {
      if (gameOver || !matchReady) {
        return;
      }

      const fromRot = current.rotation;
      const toRot = (fromRot + (dir === 1 ? 1 : 3)) % 4;
      const rotated = dir === 1 ? rotateClockwise(current.shape) : rotateCounterClockwise(current.shape);
      const tests = getKickTests(current.type, fromRot, toRot);

      for (const [dx, dy] of tests) {
        const testX = current.x + dx;
        const testY = current.y - dy;
        if (!collides(rotated, testX, testY)) {
          current.shape = rotated;
          current.x = testX;
          current.y = testY;
          current.rotation = toRot;
          current.lastRotate = true;
          lockAccumulator = 0;
          return;
        }
      }
    }

    // ソフトドロップ処理
    function softDrop() {
      if (gameOver || !matchReady) {
        return;
      }

      const moved = stepDown();
      if (moved) {
        score += 1;
        updateStats();
      }
    }

    // ハードドロップ処理
    function hardDrop() {
      if (gameOver || !matchReady) {
        return;
      }

      let distance = 0;
      while (!collides(current.shape, current.x, current.y + 1)) {
        current.y += 1;
        distance++;
      }
      if (distance > 0) {
        current.lastRotate = false;
      }
      score += distance * 2;
      updateStats();
      lockCurrentPiece();
    }

    // ホールド処理
    function holdPiece() {
      if (gameOver || !current || !canHold || !matchReady) {
        return;
      }

      const nowType = current.type;
      if (holdType === null) {
        holdType = nowType;
        canHold = false;
        spawnPiece();
      } else {
        const swapType = holdType;
        holdType = nowType;
        canHold = false;
        spawnPiece(swapType);
      }

      drawHold();
    }

    // 統計表示更新
    function updateStats() {
      scoreEl.textContent = String(score);
      linesEl.textContent = String(clearedLines);
      levelEl.textContent = String(level);
    }

    // ステータス表示更新
    function setStatus(text, over = false) {
      statusEl.textContent = text;
      statusEl.classList.remove("playing", "over");
      statusEl.classList.add(over ? "over" : "playing");
    }

    // 盤面背景グリッド描画
    function drawGrid() {
      g.strokeStyle = "rgba(100, 116, 139, 0.15)";
      g.lineWidth = 1;

      for (let x = 0; x <= COLS; x++) {
        g.beginPath();
        g.moveTo(x * BLOCK + 0.5, 0);
        g.lineTo(x * BLOCK + 0.5, ROWS * BLOCK);
        g.stroke();
      }

      for (let y = 0; y <= ROWS; y++) {
        g.beginPath();
        g.moveTo(0, y * BLOCK + 0.5);
        g.lineTo(COLS * BLOCK, y * BLOCK + 0.5);
        g.stroke();
      }
    }

    // 盤面描画
    function drawBoard() {
      g.clearRect(0, 0, gameCanvas.width, gameCanvas.height);
      g.fillStyle = "#020617";
      g.fillRect(0, 0, gameCanvas.width, gameCanvas.height);
      drawGrid();

      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const cell = board[y][x];
          if (!cell) {
            continue;
          }
          drawCell(g, x, y, COLORS[cell], BLOCK);
        }
      }
    }

    // ゴースト描画
    function drawGhostPiece() {
      if (!current) {
        return;
      }

      const ghostY = getGhostY(current);
      for (let y = 0; y < current.shape.length; y++) {
        for (let x = 0; x < current.shape[y].length; x++) {
          if (!current.shape[y][x]) {
            continue;
          }
          const px = current.x + x;
          const py = ghostY + y;
          if (py >= 0) {
            drawCell(g, px, py, COLORS[current.type], BLOCK, 0.22);
          }
        }
      }
    }

    // 現在ピース描画
    function drawCurrentPiece() {
      if (!current) {
        return;
      }
      for (let y = 0; y < current.shape.length; y++) {
        for (let x = 0; x < current.shape[y].length; x++) {
          if (!current.shape[y][x]) {
            continue;
          }
          const px = current.x + x;
          const py = current.y + y;
          if (py >= 0) {
            drawCell(g, px, py, COLORS[current.type], BLOCK);
          }
        }
      }
    }

    // 1フレーム更新関数
    function update(time = 0) {
      if (!matchReady) {
        drawBoard();
        animationId = requestAnimationFrame(update);
        return;
      }

      if (gameOver) {
        drawBoard();
        // ゲームオーバー後もエフェクトを継続して描画する
        drawLineFlash(time);
        updateAndDrawParticles();
        drawGhostPiece();
        drawCurrentPiece();
        animationId = requestAnimationFrame(update);
        return;
      }

      const delta = time - lastTime;
      lastTime = time;
      dropAccumulator += delta;

      const interval = currentDropInterval();
      if (dropAccumulator >= interval) {
        stepDown();
        dropAccumulator = 0;
      }

      if (isGrounded(current)) {
        lockAccumulator += delta;
        if (lockAccumulator >= LOCK_DELAY_MS) {
          lockCurrentPiece();
        }
      } else {
        lockAccumulator = 0;
      }

      drawBoard();
      // ラインフラッシュとパーティクルをボードの上に描画する
      drawLineFlash(time);
      updateAndDrawParticles();
      drawGhostPiece();
      drawCurrentPiece();

      // 盤面データをスロットルして相手へ送信する
      if (matchReady && time - lastBoardSendTime >= BOARD_SEND_INTERVAL) {
        lastBoardSendTime = time;
        socket.emit("boardUpdate", { board: board });
      }

      animationId = requestAnimationFrame(update);
    }

    // ゲーム開始・再開始処理
    function startGame() {
      board = createBoard();
      current = null;
      score = 0;
      clearedLines = 0;
      level = 1;
      gameOver = false;
      lastTime = 0;
      dropAccumulator = 0;
      bag = [];
      nextQueue = [];
      holdType = null;
      canHold = true;
      lockAccumulator = 0;
      pendingGarbage = 0;
      opponentBoard = null;
      lastBoardSendTime = 0;

      ensureNextQueue(5);
      updateGarbageStock();
      updateStats();
      setStatus("対戦中", false);
      spawnPiece();
      drawNext();
      drawHold();
      drawBoard();
      drawGhostPiece();
      drawCurrentPiece();

      // アニメーションループを再起動する
      if (animationId !== null) {
        cancelAnimationFrame(animationId);
      }
      animationId = requestAnimationFrame(update);
    }

    // 指定した画面を表示し他を非表示にする関数
    function showScreen(id) {
      ["loginScreen", "lobbyScreen", "gameScreen", "resultScreen"].forEach((screenId) => {
        const el = document.getElementById(screenId);
        if (!el) {
          return;
        }
        if (screenId === id) {
          // ゲーム画面はグリッドレイアウトで表示する
          el.style.display = screenId === "gameScreen" ? "grid" : "flex";
        } else {
          el.style.display = "none";
        }
      });
    }

    // ロビー画面へ戻る処理
    function enterLobby() {
      matchReady = false;
      gameOver = true;
      roomId = "";
      playerNumber = 0;
      if (animationId !== null) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }
      document.getElementById("matchingStatus").textContent = "";
      document.getElementById("matchBtn").disabled = false;
      showScreen("lobbyScreen");
    }

    // 対戦開始状態へ切り替える関数
    function enterMatchMode() {
      matchReady = true;
      updateMatchInfo("対戦中", true);
      startGame();
    }

    // キー入力処理（ゲーム画面表示中のみ有効）
    window.addEventListener("keydown", (e) => {
      const key = e.key;

      // ゲーム画面が非表示なら操作を無視する
      if (document.getElementById("gameScreen").style.display === "none") {
        return;
      }

      if (gameOver && key !== "Shift" && key !== "c" && key !== "C") {
        return;
      }

      if (key === "ArrowLeft") {
        e.preventDefault();
        move(-1);
      } else if (key === "ArrowRight") {
        e.preventDefault();
        move(1);
      } else if (key === "ArrowUp" || key === "x" || key === "X") {
        e.preventDefault();
        rotate(1);
      } else if (key === "z" || key === "Z") {
        e.preventDefault();
        rotate(-1);
      } else if (key === "ArrowDown") {
        e.preventDefault();
        softDrop();
      } else if (key === " ") {
        e.preventDefault();
        hardDrop();
      } else if (key === "Shift" || key === "c" || key === "C") {
        e.preventDefault();
        holdPiece();
      }

      drawBoard();
      drawGhostPiece();
      drawCurrentPiece();
    });

    // リスタートボタン処理
    restartBtn.addEventListener("click", () => {
      if (!matchReady) {
        return;
      }
      startGame();
    });

    // デバッグ用レベルアップボタン処理
    levelUpBtn.addEventListener("click", () => {
      if (gameOver || !matchReady) {
        return;
      }

      level += 1;
      clearedLines = Math.max(clearedLines, (level - 1) * LEVEL_LINES);
      updateStats();
      setStatus(`デバッグ: レベル${level}`, false);
    });

    // ログインボタン処理
    document.getElementById("loginBtn").addEventListener("click", () => {
      const name = document.getElementById("nameInput").value.trim();
      if (!name) {
        return;
      }
      myPlayerName = name;
      document.getElementById("greeting").textContent = `こんにちは、${name}さん`;
      showScreen("lobbyScreen");
    });

    // Enterキーでもログインできるようにする
    document.getElementById("nameInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        document.getElementById("loginBtn").click();
      }
    });

    // マッチングボタン処理（テトリス）
    document.getElementById("matchBtn").addEventListener("click", () => {
      document.getElementById("matchBtn").disabled = true;
      document.getElementById("matchingStatus").textContent = "対戦相手を待っています...";
      socket.emit("joinMatch", { playerName: myPlayerName });
    });

    // ブロックブラストボタン処理（blockblast.htmlへ遷移する）
    document.getElementById("matchBBBtn").addEventListener("click", () => {
      localStorage.setItem("bbPlayerName", myPlayerName);
      window.location.href = "/blockblast.html";
    });

    // タイピングバトルボタン処理（typing.htmlへ遷移する）
    document.getElementById("matchTypingBtn").addEventListener("click", () => {
      localStorage.setItem("typingPlayerName", myPlayerName);
      window.location.href = "/typing.html";
    });

    // カードゲームボタン処理（cardgame.htmlへ遷移する）
    document.getElementById("matchCardBtn").addEventListener("click", () => {
      localStorage.setItem("cgPlayerName", myPlayerName);
      window.location.href = "/cardgame.html";
    });

    // ロビーへ戻るボタン処理
    document.getElementById("backToLobbyBtn").addEventListener("click", () => {
      socket.emit("leaveRoom");
      enterLobby();
    });

    // 待機状態通知の処理（ロビー画面上で状態を更新する）
    socket.on("waiting", (payload) => {
      roomId = payload.roomId;
      playerNumber = payload.playerNumber;
      document.getElementById("matchingStatus").textContent = "対戦相手を待っています...";
    });

    // 対戦開始通知の処理
    socket.on("matchStart", (payload) => {
      roomId = payload.roomId;
      playerNumber = payload.playerNumber;
      myPlayerName = payload.myName || myPlayerName;
      opponentPlayerName = payload.opponentName || "相手";

      // プレイヤー名バーを更新する
      document.getElementById("myNameDisplay").textContent = `${myPlayerName}（あなた）`;
      document.getElementById("opponentNameDisplay").textContent = opponentPlayerName;
      // 相手盤面パネルのラベルを更新する
      document.getElementById("opponentNameLabel").textContent = opponentPlayerName;

      // ゲーム画面へ遷移して対戦を開始する
      showScreen("gameScreen");
      enterMatchMode();
    });

    // おじゃまライン受信時の処理
    socket.on("receiveGarbage", (payload) => {
      const count = Number(payload?.count || 0);
      if (!Number.isFinite(count) || count <= 0) {
        return;
      }
      pendingGarbage += count;
      updateGarbageStock();
      setStatus(`おじゃま ${count} ライン受信`, false);
      // 被弾時の演出を発動する（画面赤フラッシュ・受信おじゃま表示シェイク）
      triggerScreenFlash();
      triggerShake("garbageStock");
    });

    // 勝敗結果受信時の処理
    socket.on("result", (payload) => {
      // アニメーションループを停止する
      if (animationId !== null) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }

      const resultTextEl = document.getElementById("resultText");
      if (payload.win) {
        resultTextEl.textContent = "あなたの勝ち！";
        resultTextEl.className = "result-win";
      } else {
        resultTextEl.textContent = "あなたの負け...";
        resultTextEl.className = "result-lose";
      }
      showScreen("resultScreen");
    });

    // 相手の盤面更新を受信して描画する
    socket.on("opponentBoardUpdate", (payload) => {
      const board = payload?.board;
      // 受信データが正しい20行×10列の配列であることを確認する
      if (!Array.isArray(board) || board.length !== ROWS || !board.every((row) => Array.isArray(row) && row.length === COLS)) {
        return;
      }
      opponentBoard = board;
      drawOpponentBoard();
    });

    // 相手切断時の処理
    socket.on("opponentLeft", () => {
      document.getElementById("matchingStatus").textContent = "相手が切断しました。";
      enterLobby();
    });

    // 起動時はログイン画面を表示する
    showScreen("loginScreen");
  </script>
</body>
</html>
