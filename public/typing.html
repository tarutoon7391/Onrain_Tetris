<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>タイピングバトル | オンラインゲームセンター</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #1f2937;
      --text: #e5e7eb;
      --accent: #10b981;
      --border: #374151;
      --danger: #ef4444;
      --ok: #22c55e;
      --warn: #f59e0b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background: radial-gradient(circle at top, #0d1f15 0%, #0b1020 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* 各画面共通ラッパー */
    .screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    /* カード */
    .card {
      background: linear-gradient(180deg, rgba(20,30,20,0.98), rgba(10,15,10,0.98));
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 14px;
      padding: 48px 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5), 0 0 18px rgba(16,185,129,0.1);
      text-align: center;
    }

    .card h1 {
      font-size: 1.6rem;
      margin: 0 0 28px;
      color: var(--accent);
      letter-spacing: 0.06em;
    }

    /* 待機中ステータス */
    .matching-status {
      margin-top: 16px;
      font-size: 0.9rem;
      color: #fde68a;
      min-height: 1.4em;
    }

    /* 勝敗テキスト */
    .result-win {
      font-size: 2.8rem;
      font-weight: 900;
      color: var(--ok);
      margin: 0 0 16px;
    }

    .result-lose {
      font-size: 2.8rem;
      font-weight: 900;
      color: var(--danger);
      margin: 0 0 16px;
    }

    .result-time {
      font-size: 1rem;
      color: rgba(200,255,200,0.7);
      margin: 0 0 28px;
    }

    /* ボタン */
    button {
      cursor: pointer;
      border: 1px solid var(--accent);
      color: white;
      background: linear-gradient(180deg, #059669, #047857);
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      padding: 12px 24px;
      width: 100%;
    }

    button:hover {
      filter: brightness(1.1);
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* ===== ゲーム画面 ===== */
    .game-screen {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ヘッダーバー（プレイヤー名と進捗） */
    .header-bar {
      background: rgba(20,30,20,0.95);
      border: 1px solid rgba(16,185,129,0.35);
      border-radius: 12px;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
    }

    .header-bar .my-name {
      color: var(--accent);
      font-weight: 700;
    }

    .header-bar .opponent-name {
      color: var(--warn);
      font-weight: 700;
    }

    .header-bar .vs-text {
      color: rgba(200,200,200,0.5);
      font-size: 0.8rem;
      letter-spacing: 0.1em;
    }

    /* メインコンテンツ（文章表示 + 相手進捗） */
    .game-content {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    /* タイピングエリア（左・メイン） */
    .typing-area {
      flex: 1;
      background: rgba(10,20,12,0.97);
      border: 1px solid rgba(16,185,129,0.35);
      border-radius: 12px;
      padding: 24px;
    }

    /* タイトル表示 */
    .typing-area .area-title {
      font-size: 0.8rem;
      color: rgba(160,220,180,0.6);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    /* 文章表示ボックス */
    #textDisplay {
      font-size: 1.15rem;
      line-height: 2.2;
      letter-spacing: 0.04em;
      word-break: break-all;
      min-height: 80px;
      margin-bottom: 16px;
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    }

    /* 原文（参考用）表示ボックス */
    #refDisplay {
      font-size: 0.95rem;
      line-height: 1.8;
      word-break: break-all;
      color: rgba(160, 220, 180, 0.5);
      margin-bottom: 6px;
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    }

    /* セクションラベル */
    .section-label {
      font-size: 0.7rem;
      color: rgba(160, 220, 180, 0.4);
      letter-spacing: 0.1em;
      margin-bottom: 4px;
    }

    /* タイプ済みひらがな音節 */
    .char-done {
      color: rgba(100, 220, 140, 0.5);
    }

    /* 現在入力中のひらがな音節 */
    .char-current {
      color: #ffffff;
      background: rgba(16, 185, 129, 0.55);
      border-radius: 2px;
      padding: 0 1px;
    }

    /* まだ打っていないひらがな音節 */
    .char-pending {
      color: rgba(220, 220, 240, 0.85);
    }

    /* ===== ルビ（漢字単語単位）表示 ===== */
    ruby {
      ruby-align: center;
    }

    rt {
      font-size: 0.55em;
      color: rgba(160, 220, 180, 0.6);
    }

    /* 打ち終わった単語 */
    .word-done {
      color: rgba(100, 220, 140, 0.5);
    }

    .word-done rt {
      color: rgba(100, 220, 140, 0.35);
    }

    /* 現在入力中の単語 */
    .word-current {
      color: #ffffff;
      background: rgba(16, 185, 129, 0.22);
      border-radius: 3px;
      padding: 0 2px;
    }

    .word-current rt {
      color: var(--accent);
    }

    /* まだ打っていない単語 */
    .word-pending {
      color: rgba(220, 220, 240, 0.85);
    }

    /* ===== ローマ字入力フィードバック ===== */
    #romajiDisplay {
      font-size: 1rem;
      font-family: "Courier New", "Consolas", monospace;
      letter-spacing: 0.05em;
      word-break: break-all;
      min-height: 1.6em;
      margin-top: 2px;
      margin-bottom: 4px;
    }

    /* 入力済みローマ字 */
    .romaji-done {
      color: rgba(100, 220, 140, 0.45);
    }

    /* 現在の音節で入力済みの部分 */
    .romaji-typed {
      color: #4ade80;
      font-weight: bold;
    }

    /* 現在の音節の残り（候補表示） */
    .romaji-alts {
      color: #ffffff;
      background: rgba(16, 185, 129, 0.5);
      border-radius: 2px;
      padding: 0 2px;
    }

    /* まだ入力していないローマ字 */
    .romaji-pending {
      color: rgba(220, 220, 240, 0.45);
    }

    /* 現在音節の代替入力候補 */
    #altHintDisplay {
      font-size: 0.8rem;
      color: var(--warn);
      min-height: 1.3em;
      margin-bottom: 8px;
      letter-spacing: 0.05em;
    }

    /* 進捗バー */
    .progress-bar-wrap {
      background: rgba(30,50,35,0.7);
      border-radius: 999px;
      height: 10px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #059669, #34d399);
      border-radius: 999px;
      transition: width 0.15s ease;
    }

    .progress-label {
      font-size: 0.83rem;
      color: rgba(160,220,180,0.7);
      text-align: right;
    }

    /* 入力フィールド（IME制御用・視覚的に非表示） */
    #typingInput {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      width: 1px;
      height: 1px;
    }

    /* クリックで入力フォーカスを誘導するヒント */
    .click-hint {
      font-size: 0.8rem;
      color: rgba(160,220,180,0.55);
      margin-top: 10px;
      cursor: pointer;
    }

    /* ===== 相手パネル（右・小） ===== */
    .opponent-panel {
      width: 220px;
      flex-shrink: 0;
      background: rgba(10,15,20,0.95);
      border: 1px solid rgba(245,158,11,0.3);
      border-radius: 12px;
      padding: 16px;
      font-size: 0.82rem;
    }

    .opponent-panel .panel-title {
      font-size: 0.75rem;
      color: rgba(245,158,11,0.7);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 12px;
      font-weight: 700;
    }

    /* 相手の進捗バー */
    .opp-progress-bar-wrap {
      background: rgba(40,30,10,0.7);
      border-radius: 999px;
      height: 8px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .opp-progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #d97706, #fbbf24);
      border-radius: 999px;
      transition: width 0.2s ease;
    }

    .opp-progress-label {
      font-size: 0.78rem;
      color: rgba(245,158,11,0.7);
      text-align: right;
      margin-bottom: 12px;
    }

    /* 相手のテキスト表示（縮小版） */
    #opponentTextDisplay {
      font-size: 0.72rem;
      line-height: 1.8;
      word-break: break-all;
      color: rgba(200,180,150,0.7);
      max-height: 200px;
      overflow: hidden;
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    }

    /* 相手のタイプ済み文字（縮小版） */
    .opp-char-done {
      color: rgba(245, 158, 11, 0.45);
    }

    /* 相手の現在位置（縮小版） */
    .opp-char-current {
      color: #fff;
      background: rgba(245,158,11,0.5);
      border-radius: 2px;
    }

    /* 相手のまだ打っていない文字（縮小版） */
    .opp-char-pending {
      color: rgba(200,180,150,0.45);
    }

    /* カウントダウン表示 */
    #countdown {
      font-size: 4rem;
      font-weight: 900;
      color: var(--accent);
      text-align: center;
      letter-spacing: 0.1em;
    }

    /* スタート表示 */
    #startLabel {
      font-size: 2.2rem;
      font-weight: 900;
      color: #fff;
      text-align: center;
    }

    /* レスポンシブ対応 */
    @media (max-width: 680px) {
      .game-content {
        flex-direction: column;
      }

      .opponent-panel {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- 待機画面 -->
  <div id="waitingScreen" class="screen">
    <div class="card">
      <h1>⌨️ タイピングバトル</h1>
      <p id="waitingStatus" class="matching-status">対戦相手を探しています...</p>
      <button id="cancelBtn" type="button" style="margin-top:24px;background:linear-gradient(180deg,#6b7280,#4b5563);border-color:#6b7280">
        キャンセルしてロビーへ戻る
      </button>
    </div>
  </div>

  <!-- カウントダウン画面 -->
  <div id="countdownScreen" class="screen" style="display:none">
    <div id="countdown"></div>
    <div id="startLabel" style="display:none">スタート！</div>
  </div>

  <!-- ゲーム画面 -->
  <div id="gameScreen" class="game-screen" style="display:none">
    <!-- プレイヤー名バー -->
    <div class="header-bar">
      <div>
        <span class="my-name" id="myNameDisplay">あなた</span>
        <span style="font-size:0.8rem;color:rgba(160,220,180,0.6);margin-left:8px" id="myProgressText">0%</span>
      </div>
      <div class="vs-text">VS</div>
      <div style="text-align:right">
        <span class="opponent-name" id="opponentNameDisplay">相手</span>
        <span style="font-size:0.8rem;color:rgba(245,158,11,0.6);margin-left:8px" id="oppProgressText">0%</span>
      </div>
    </div>

    <div class="game-content">
      <!-- タイピングエリア（メイン） -->
      <div class="typing-area" id="typingArea">
        <div class="area-title">⌨️ Typing Battle</div>

        <!-- 原文表示（参考用） -->
        <div class="section-label">原文</div>
        <div id="refDisplay"></div>

        <!-- 読み（タイプ対象） -->
        <div class="section-label">読み（ひらがな）</div>
        <!-- ひらがな音節ハイライト表示 -->
        <div id="textDisplay"></div>

        <!-- ローマ字入力フィードバック -->
        <div class="section-label">ローマ字</div>
        <div id="romajiDisplay"></div>
        <!-- 現在音節の複数表記候補 -->
        <div id="altHintDisplay"></div>

        <!-- 自分の進捗バー -->
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" id="myProgressBar" style="width:0%"></div>
        </div>
        <div class="progress-label" id="myProgressLabel">0 / 0 文字</div>

        <!-- フォーカスヒント -->
        <div class="click-hint" id="clickHint" onclick="focusInput()">
          クリックして入力開始 ▶
        </div>

        <!-- 透明な入力フィールド（キーイベント受付用） -->
        <input id="typingInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
      </div>

      <!-- 相手進捗パネル（右） -->
      <div class="opponent-panel">
        <div class="panel-title">相手の進捗</div>
        <!-- 相手の進捗バー -->
        <div class="opp-progress-bar-wrap">
          <div class="opp-progress-bar-fill" id="oppProgressBar" style="width:0%"></div>
        </div>
        <div class="opp-progress-label" id="oppProgressLabel">0 / 0 文字</div>
        <!-- 相手のテキスト表示（小） -->
        <div id="opponentTextDisplay"></div>
      </div>
    </div>
  </div>

  <!-- 勝敗画面 -->
  <div id="resultScreen" class="screen" style="display:none">
    <div class="card">
      <p id="resultText"></p>
      <p class="result-time" id="resultTime"></p>
      <button id="backToLobbyBtn" type="button">🏠 ロビーに戻る</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // Socket.ioへ接続する
    const socket = io();

    // プレイヤー名をローカルストレージから取得する
    const myPlayerName = localStorage.getItem("typingPlayerName") || "ゲスト";

    // ============================
    // ローマ字→ひらがな変換テーブル（長い順・貪欲マッチ用）
    // ============================
    const ROMAJI_TABLE = [
      // 3文字以上（拗音など）
      ["sha","しゃ"],["shi","し"],["shu","しゅ"],["sho","しょ"],
      ["chi","ち"],["cha","ちゃ"],["chu","ちゅ"],["cho","ちょ"],
      ["tsu","つ"],
      ["kya","きゃ"],["kyu","きゅ"],["kyo","きょ"],
      ["nya","にゃ"],["nyu","にゅ"],["nyo","にょ"],
      ["hya","ひゃ"],["hyu","ひゅ"],["hyo","ひょ"],
      ["mya","みゃ"],["myu","みゅ"],["myo","みょ"],
      ["rya","りゃ"],["ryu","りゅ"],["ryo","りょ"],
      ["gya","ぎゃ"],["gyu","ぎゅ"],["gyo","ぎょ"],
      ["bya","びゃ"],["byu","びゅ"],["byo","びょ"],
      ["pya","ぴゃ"],["pyu","ぴゅ"],["pyo","ぴょ"],
      ["zya","じゃ"],["zyu","じゅ"],["zyo","じょ"],
      ["tya","ちゃ"],["tyu","ちゅ"],["tyo","ちょ"],
      ["sya","しゃ"],["syu","しゅ"],["syo","しょ"],
      // 2文字
      ["ka","か"],["ki","き"],["ku","く"],["ke","け"],["ko","こ"],
      ["sa","さ"],["si","し"],["su","す"],["se","せ"],["so","そ"],
      ["ta","た"],["ti","ち"],["tu","つ"],["te","て"],["to","と"],
      ["na","な"],["ni","に"],["nu","ぬ"],["ne","ね"],["no","の"],
      ["ha","は"],["hi","ひ"],["fu","ふ"],["hu","ふ"],["he","へ"],["ho","ほ"],
      ["ma","ま"],["mi","み"],["mu","む"],["me","め"],["mo","も"],
      ["ya","や"],["yu","ゆ"],["yo","よ"],
      ["ra","ら"],["ri","り"],["ru","る"],["re","れ"],["ro","ろ"],
      ["wa","わ"],["wi","ゐ"],["we","ゑ"],["wo","を"],
      ["ga","が"],["gi","ぎ"],["gu","ぐ"],["ge","げ"],["go","ご"],
      ["za","ざ"],["zi","じ"],["zu","ず"],["ze","ぜ"],["zo","ぞ"],
      ["da","だ"],["di","ぢ"],["du","づ"],["de","で"],["do","ど"],
      ["ba","ば"],["bi","び"],["bu","ぶ"],["be","べ"],["bo","ぼ"],
      ["pa","ぱ"],["pi","ぴ"],["pu","ぷ"],["pe","ぺ"],["po","ぽ"],
      ["ja","じゃ"],["ji","じ"],["ju","じゅ"],["jo","じょ"],
      // 1文字
      ["a","あ"],["i","い"],["u","う"],["e","え"],["o","お"],
      ["n","ん"],
      [".","。"],[",","、"],["-","ー"],
    ];

    // ひらがな→複数ローマ字表記テーブル（標準 + 代替）
    const HIRAGANA_ALT_ROMAJI = {
      "し":  ["shi","si"],
      "ち":  ["chi","ti"],
      "つ":  ["tsu","tu"],
      "ふ":  ["fu","hu"],
      "じ":  ["ji","zi"],
      "しゃ":["sha","sya"],
      "しゅ":["shu","syu"],
      "しょ":["sho","syo"],
      "ちゃ":["cha","tya"],
      "ちゅ":["chu","tyu"],
      "ちょ":["cho","tyo"],
      "じゃ":["ja","zya"],
      "じゅ":["ju","zyu"],
      "じょ":["jo","zyo"],
      "づ":  ["du","zu"],
    };

    // ============================
    // ローマ字文字列を音節配列へ分解する関数
    // 各音節: { romaji: string, hiragana: string, alts: string[], isSokuon: bool, isN: bool, nextConsonant: string }
    // ============================
    function parseRomajiToSyllables(romaji) {
      const result = [];
      let i = 0;
      const VOWELS = new Set(["a","i","u","e","o"]);
      while (i < romaji.length) {
        const c = romaji[i];
        // 促音（っ）の検出: 'n' 以外の子音が連続する場合
        if (!VOWELS.has(c) && c !== "n" && i + 1 < romaji.length && romaji[i + 1] === c) {
          result.push({ romaji: c, hiragana: "っ", alts: null, isSokuon: true, nextConsonant: c });
          i++;
          continue;
        }
        // 通常のローマ字マッチング（長い順で貪欲マッチ）
        let matched = false;
        for (const [rom, hira] of ROMAJI_TABLE) {
          if (romaji.startsWith(rom, i)) {
            const alts = HIRAGANA_ALT_ROMAJI[hira] ? [...HIRAGANA_ALT_ROMAJI[hira]] : [rom];
            result.push({
              romaji: rom,
              hiragana: hira,
              alts,
              isSokuon: false,
              isN: rom === "n",
            });
            i += rom.length;
            matched = true;
            break;
          }
        }
        if (!matched) {
          // 未知の文字はそのまま1文字扱い
          result.push({ romaji: c, hiragana: c, alts: [c], isSokuon: false });
          i++;
        }
      }
      return result;
    }

    // 指定音節インデックスの有効なローマ字入力候補を返す
    // っ と ん の特殊ケースを考慮する
    function computeAlts(idx) {
      const s = syllables[idx];
      if (!s) return [];
      if (s.isSokuon) {
        // っ: 次の子音1文字 または xtu/ltu/xtsu/ltsu
        return [s.nextConsonant, "xtu","ltu","xtsu","ltsu"];
      }
      if (s.isN) {
        // ん: 次の音節が母音・n系で始まる場合は nn 必須、それ以外は n も可
        const next = syllables[idx + 1];
        if (next) {
          const nextFirst = (next.alts ? next.alts[0] : next.romaji)[0];
          if ("aiueony".includes(nextFirst)) {
            return ["nn"];
          }
        }
        return ["n","nn"];
      }
      return s.alts || [s.romaji];
    }

    // ============================
    // ゲーム状態変数
    // ============================
    let targetText    = "";   // 表示用原文
    let targetReading = "";   // タイピング用ローマ字（サーバー canonical）
    let targetWords   = [];   // ルビ表示用単語配列 [{text, reading}]
    let syllables     = [];   // パース済み音節配列
    let currentSyllableIdx = 0;  // 現在の音節インデックス
    let currentTyped       = ""; // 現在の音節で入力済みのローマ字
    let myRomajiProgress   = 0;  // サーバー送信用のローマ字文字数進捗
    let oppProgress        = 0;  // 相手の進捗（ローマ字文字数）
    let gameActive    = false;
    let startTime     = null;
    let isComposing   = false;

    // ============================
    // 画面切り替え関数
    // ============================
    function showScreen(id) {
      ["waitingScreen","countdownScreen","gameScreen","resultScreen"].forEach((sid) => {
        const el = document.getElementById(sid);
        if (el) el.style.display = sid === id ? "flex" : "none";
      });
    }

    // ============================
    // HTMLエスケープ関数
    // ============================
    function escapeHtml(str) {
      return str
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/ /g,"&nbsp;");
    }

    // ============================
    // 現在の音節ひらがな位置（文字数）を返す
    // ============================
    function getHiraganaPosition(syllIdx) {
      let pos = 0;
      for (let i = 0; i < syllIdx && i < syllables.length; i++) {
        pos += [...syllables[i].hiragana].length;
      }
      return pos;
    }

    // ============================
    // ルビ付き原文表示を更新する（漢字単語単位ハイライト）
    // ============================
    function updateRefDisplay() {
      const el = document.getElementById("refDisplay");
      if (!el) return;
      if (!targetWords.length) {
        el.textContent = targetText;
        return;
      }
      // 現在のひらがな位置から現在の単語インデックスを求める
      const hiraPos = getHiraganaPosition(currentSyllableIdx);
      let cumHira = 0;
      let currentWordIdx = targetWords.length;
      for (let w = 0; w < targetWords.length; w++) {
        const wLen = [...targetWords[w].reading].length;
        if (hiraPos < cumHira + wLen) {
          currentWordIdx = w;
          break;
        }
        cumHira += wLen;
      }
      // ルビ付きHTMLを組み立てる
      let html = "";
      for (let w = 0; w < targetWords.length; w++) {
        const word = targetWords[w];
        const text = escapeHtml(word.text);
        const reading = escapeHtml(word.reading);
        let cls;
        if (w < currentWordIdx) {
          cls = "word-done";
        } else if (w === currentWordIdx) {
          cls = "word-current";
        } else {
          cls = "word-pending";
        }
        if (word.reading === "") {
          // 句読点などルビ不要な文字
          html += `<span class="${cls}">${text}</span>`;
        } else {
          html += `<ruby class="${cls}"><rb>${text}</rb><rt>${reading}</rt></ruby>`;
        }
      }
      el.innerHTML = html;
    }

    // ============================
    // ひらがな読み表示を更新する（音節単位ハイライト）
    // ============================
    function updateTextDisplay() {
      const el = document.getElementById("textDisplay");
      if (!el || !syllables.length) return;
      let html = "";
      for (let i = 0; i < syllables.length; i++) {
        const h = escapeHtml(syllables[i].hiragana);
        if (i < currentSyllableIdx) {
          html += `<span class="char-done">${h}</span>`;
        } else if (i === currentSyllableIdx) {
          html += `<span class="char-current">${h}</span>`;
        } else {
          html += `<span class="char-pending">${h}</span>`;
        }
      }
      el.innerHTML = html;
      // 現在位置が見えるようにスクロールする
      const cur = el.querySelector(".char-current");
      if (cur) cur.scrollIntoView({ block: "nearest" });
    }

    // ============================
    // ローマ字入力フィードバック表示を更新する
    // ============================
    function updateRomajiDisplay() {
      const el    = document.getElementById("romajiDisplay");
      const altEl = document.getElementById("altHintDisplay");
      if (!el || !syllables.length) return;

      const alts = computeAlts(currentSyllableIdx);
      // 入力済み部分（完了音節のローマ字を結合）
      let done = "";
      for (let i = 0; i < currentSyllableIdx; i++) {
        done += syllables[i].romaji;
      }
      // 残り部分（次の音節以降の canonical ローマ字を結合）
      let pending = "";
      for (let i = currentSyllableIdx + 1; i < syllables.length; i++) {
        pending += syllables[i].romaji;
      }
      // 現在音節: 入力済み部分と残り候補を組み立てる
      let currentHtml = "";
      if (currentSyllableIdx < syllables.length) {
        const typed = escapeHtml(currentTyped);
        // 各候補の残り部分を取得する
        const remaining = alts
          .filter(a => a.startsWith(currentTyped))
          .map(a => escapeHtml(a.slice(currentTyped.length)));
        const uniqueRemaining = [...new Set(remaining)];
        const remainStr = uniqueRemaining.join("/");
        currentHtml =
          `<span class="romaji-typed">${typed}</span>` +
          `<span class="romaji-alts">${remainStr}</span>`;
      }

      el.innerHTML =
        `<span class="romaji-done">${escapeHtml(done)}</span>` +
        currentHtml +
        `<span class="romaji-pending">${escapeHtml(pending)}</span>`;

      // 複数表記がある場合はヒントを表示する
      if (altEl) {
        if (alts.length > 1 && currentSyllableIdx < syllables.length) {
          const hintAlts = alts.map(a => escapeHtml(a)).join(" / ");
          altEl.textContent = `入力候補: ${hintAlts}`;
        } else {
          altEl.textContent = "";
        }
      }
    }

    // ============================
    // 相手のテキスト表示を更新する（ひらがな音節表示）
    // ============================
    function updateOpponentTextDisplay() {
      const el = document.getElementById("opponentTextDisplay");
      if (!el || !syllables.length) return;
      // 相手のローマ字進捗を音節インデックスへ変換する
      let oppSyllIdx = 0;
      let cumRomaji  = 0;
      for (let i = 0; i < syllables.length; i++) {
        cumRomaji += syllables[i].romaji.length;
        if (cumRomaji > oppProgress) break;
        oppSyllIdx = i + 1;
      }
      // 相手の前後の音節だけ表示する
      const start = Math.max(0, oppSyllIdx - 8);
      const end   = Math.min(syllables.length, oppSyllIdx + 20);
      let html = "";
      for (let i = start; i < end; i++) {
        const h = escapeHtml(syllables[i].hiragana);
        if (i < oppSyllIdx) {
          html += `<span class="opp-char-done">${h}</span>`;
        } else if (i === oppSyllIdx) {
          html += `<span class="opp-char-current">${h}</span>`;
        } else {
          html += `<span class="opp-char-pending">${h}</span>`;
        }
      }
      el.innerHTML = html;
    }

    // ============================
    // 進捗バーとラベルを更新する
    // ============================
    function updateProgressUI() {
      const total = targetReading.length;
      const myPct = total > 0 ? Math.round((myRomajiProgress / total) * 100) : 0;
      document.getElementById("myProgressBar").style.width  = `${myPct}%`;
      document.getElementById("myProgressLabel").textContent = `${currentSyllableIdx} / ${syllables.length} 音節`;
      document.getElementById("myProgressText").textContent  = `${myPct}%`;

      const oppPct = total > 0 ? Math.round((oppProgress / total) * 100) : 0;
      document.getElementById("oppProgressBar").style.width  = `${oppPct}%`;
      document.getElementById("oppProgressLabel").textContent = `${oppPct}%`;
      document.getElementById("oppProgressText").textContent  = `${oppPct}%`;
    }

    // ============================
    // 入力フィールドにフォーカスを当てる
    // ============================
    function focusInput() {
      document.getElementById("typingInput").focus();
    }

    // タイピングエリアクリックでもフォーカスを当てる
    document.getElementById("typingArea")?.addEventListener("click", focusInput);

    // 入力フィールドの参照を取得する
    const typingInput = document.getElementById("typingInput");

    // IME変換開始: 変換中フラグをセットする
    typingInput.addEventListener("compositionstart", () => { isComposing = true; });

    // IME変換確定: フラグをクリアし入力フィールドをリセットする
    // 読みはローマ字（ASCII）なので日本語入力は不要のため内容を破棄する
    typingInput.addEventListener("compositionend", () => {
      isComposing = false;
      typingInput.value = "";
    });

    // inputイベント: IME変換中でない場合のみ入力フィールドをリセットする
    typingInput.addEventListener("input", (e) => {
      if (!e.isComposing) e.target.value = "";
    });

    // ============================
    // キー入力処理関数（音節単位・複数ローマ字対応）
    // ============================
    function processKey(key) {
      if (currentSyllableIdx >= syllables.length) return;

      const s    = syllables[currentSyllableIdx];
      const alts = computeAlts(currentSyllableIdx);
      const newTyped = currentTyped + key;

      // 有効なプレフィックスを持つ候補を絞り込む
      const validAlts = alts.filter(a => a.startsWith(newTyped));

      if (validAlts.length === 0) {
        // 現在の入力と合わない場合は currentTyped をリセットして再試行する
        if (currentTyped !== "") {
          currentTyped = "";
          processKey(key);
        }
        return;
      }

      currentTyped = newTyped;

      // 完全一致する候補があれば音節を進める
      if (validAlts.some(a => a === newTyped)) {
        const isSokuonDoubling = s.isSokuon && newTyped.length === 1;
        // 音節を確定して次へ進む
        myRomajiProgress += s.romaji.length;
        currentSyllableIdx++;
        currentTyped = "";

        // 進捗をサーバーへ送信する
        socket.emit("typingProgress", { progress: myRomajiProgress });

        // UIを更新する
        updateTextDisplay();
        updateRefDisplay();
        updateRomajiDisplay();
        updateProgressUI();

        // っ を次の子音で入力した場合は同じキーを次の音節へ転送する
        if (isSokuonDoubling) {
          processKey(key);
          return;
        }

        // 全音節入力完了チェック
        if (currentSyllableIdx >= syllables.length) {
          gameActive = false;
          socket.emit("typingComplete");
        }
      } else {
        // まだ途中 → 表示だけ更新する
        updateRomajiDisplay();
      }
    }

    // documentのkeydownで1文字ずつ判定する
    document.addEventListener("keydown", (e) => {
      if (!gameActive || !syllables.length) return;

      // IME変換中は処理しない
      if (e.isComposing || isComposing) return;

      // Backspace・Tab・Escapeはデフォルト動作を抑制して無視する
      if (e.key === "Backspace" || e.key === "Tab" || e.key === "Escape") {
        e.preventDefault();
        return;
      }

      // スペースキーによるページスクロールを抑制する
      if (e.key === " ") e.preventDefault();

      // 1文字かつASCII印字可能文字（コード32〜126）のみ受け付ける
      if (e.key.length !== 1) return;
      const code = e.key.charCodeAt(0);
      if (code < 32 || code > 126) return;

      processKey(e.key);
    });

    // ============================
    // カウントダウンを表示する関数
    // ============================
    function startCountdown(callback) {
      showScreen("countdownScreen");
      const countEl = document.getElementById("countdown");
      const startEl = document.getElementById("startLabel");
      countEl.style.display = "block";
      startEl.style.display = "none";
      let count = 3;
      countEl.textContent = count;
      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          countEl.textContent = count;
        } else {
          clearInterval(timer);
          countEl.style.display = "none";
          startEl.style.display = "block";
          setTimeout(() => {
            startEl.style.display = "none";
            callback();
          }, 600);
        }
      }, 800);
    }

    // ============================
    // ゲームを開始する関数
    // ============================
    function startGame() {
      currentSyllableIdx = 0;
      currentTyped       = "";
      myRomajiProgress   = 0;
      oppProgress        = 0;
      gameActive         = true;
      startTime          = Date.now();

      document.getElementById("myNameDisplay").textContent = myPlayerName;

      showScreen("gameScreen");
      updateRefDisplay();
      updateTextDisplay();
      updateRomajiDisplay();
      updateProgressUI();
      updateOpponentTextDisplay();
      focusInput();
    }

    // ============================
    // Socket.ioイベントハンドラ
    // ============================

    // 接続時にマッチング要求を送信する
    socket.on("connect", () => {
      socket.emit("typingJoinMatch", { playerName: myPlayerName });
    });

    // 待機中通知を受け取る
    socket.on("typingWaiting", () => {
      showScreen("waitingScreen");
      document.getElementById("waitingStatus").textContent = "対戦相手を待っています...";
    });

    // 対戦開始通知を受け取る
    socket.on("typingMatchStart", (payload) => {
      targetText    = payload.text;
      targetReading = payload.reading;
      targetWords   = payload.words || [];
      syllables     = parseRomajiToSyllables(targetReading);

      const opponentName = payload.opponentName || "相手";
      document.getElementById("opponentNameDisplay").textContent = opponentName;
      document.getElementById("myNameDisplay").textContent = myPlayerName;

      // カウントダウン後にゲームを開始する
      startCountdown(() => startGame());
    });

    // 相手の進捗更新を受け取る
    socket.on("typingOpponentProgress", (payload) => {
      oppProgress = typeof payload.progress === "number" ? payload.progress : 0;
      updateProgressUI();
      updateOpponentTextDisplay();
    });

    // 勝敗通知を受け取る
    socket.on("typingResult", (payload) => {
      gameActive = false;
      showScreen("resultScreen");

      const resultEl = document.getElementById("resultText");
      const timeEl   = document.getElementById("resultTime");

      if (payload.win) {
        resultEl.className   = "result-win";
        resultEl.textContent = "🏆 WIN！";
      } else {
        resultEl.className   = "result-lose";
        resultEl.textContent = "💀 LOSE...";
      }

      if (startTime) {
        const elapsed = ((Date.now() - startTime) / 1000).toFixed(2);
        timeEl.textContent = `タイム: ${elapsed} 秒`;
      } else {
        timeEl.textContent = "";
      }
    });

    // 相手が切断した通知を受け取る
    socket.on("typingOpponentLeft", () => {
      gameActive = false;
      showScreen("waitingScreen");
      document.getElementById("waitingStatus").textContent = "相手が切断しました。再マッチング中...";
      socket.emit("typingJoinMatch", { playerName: myPlayerName });
    });

    // キャンセルボタン処理
    document.getElementById("cancelBtn").addEventListener("click", () => {
      socket.emit("typingLeaveRoom");
      window.location.href = "/";
    });

    // ロビーへ戻るボタン処理
    document.getElementById("backToLobbyBtn").addEventListener("click", () => {
      socket.emit("typingLeaveRoom");
      window.location.href = "/";
    });
  </script>
</body>
</html>
